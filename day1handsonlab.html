<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OCI IAM Lab Visualizer — Day 1 | 1Z0-1067-26</title>
<style>
:root{
  --bg:#0d1117; --bg2:#11161d; --panel:#151b23; --panel2:#1a212b;
  --border:#232b36; --border-soft:#1d2530;
  --text:#e6ebf1; --text-dim:#9aa7b6; --text-faint:#5f6b7a;
  --red:#ff3b30; --red-dim:#c62b22; --red-glow:rgba(255,59,48,.25);
  --blue:#4da3ff; --blue-dim:#2f6fd1;
  --orange:#ffab40; --green:#3ddc84; --green-dim:#279a5c;
  --yellow:#ffd54a; --purple:#b48bff;
  --radius:14px; --radius-sm:9px;
  --shadow: 0 8px 30px rgba(0,0,0,.35);
  --mono: 'SFMono-Regular', Consolas, 'Courier New', monospace;
  --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif;
}
[data-theme="light"]{
  --bg:#f4f5f7; --bg2:#eceef1; --panel:#ffffff; --panel2:#f7f8fa;
  --border:#e1e4e9; --border-soft:#ebedf0;
  --text:#1b2129; --text-dim:#5b6572; --text-faint:#8b95a3;
  --red:#e0342a; --red-dim:#c62b22; --red-glow:rgba(224,52,42,.18);
  --shadow: 0 8px 30px rgba(20,20,30,.08);
}
*{box-sizing:border-box; margin:0; padding:0;}
html{scroll-behavior:smooth;}
body{
  background:var(--bg); color:var(--text); font-family:var(--sans);
  min-height:100vh; overflow-x:hidden; transition:background .3s,color .3s;
}
body::before{
  content:''; position:fixed; inset:0; pointer-events:none; z-index:0;
  background:
    radial-gradient(circle at 15% 10%, var(--red-glow), transparent 40%),
    radial-gradient(circle at 85% 90%, rgba(77,163,255,.10), transparent 45%);
}
::-webkit-scrollbar{width:10px; height:10px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border); border-radius:10px;}
::-webkit-scrollbar-thumb:hover{background:var(--text-faint);}

a{color:inherit;}
button{font-family:inherit; cursor:pointer;}

/* ---------- Top Bar ---------- */
.topbar{
  position:sticky; top:0; z-index:100;
  display:flex; align-items:center; gap:14px;
  padding:10px 18px; background:color-mix(in srgb, var(--panel) 88%, transparent);
  backdrop-filter:blur(14px); border-bottom:1px solid var(--border-soft);
}
.brand{display:flex; align-items:center; gap:10px; font-weight:700; letter-spacing:.2px;}
.brand .logo{
  width:30px; height:30px; border-radius:8px;
  background:linear-gradient(135deg, var(--red), var(--red-dim));
  display:flex; align-items:center; justify-content:center; font-size:14px; color:#fff; font-weight:800;
  box-shadow:0 4px 14px var(--red-glow);
}
.brand small{display:block; font-weight:500; color:var(--text-faint); font-size:10.5px; letter-spacing:.5px;}
.crumb{display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--text-dim); flex:1; min-width:0; overflow:hidden; white-space:nowrap;}
.crumb b{color:var(--text); font-weight:600;}
.topbar-right{display:flex; align-items:center; gap:10px;}
.xp-chip{
  display:flex; align-items:center; gap:7px; background:var(--panel2); border:1px solid var(--border);
  padding:6px 12px; border-radius:20px; font-size:12.5px; font-weight:600;
}
.xp-chip .dot{width:7px; height:7px; border-radius:50%; background:var(--orange); box-shadow:0 0 8px var(--orange);}
.rank-chip{
  background:linear-gradient(135deg, var(--red), var(--red-dim)); color:#fff; font-size:11.5px; font-weight:700;
  padding:6px 11px; border-radius:20px; letter-spacing:.3px;
}
.icon-btn{
  width:34px; height:34px; border-radius:9px; border:1px solid var(--border); background:var(--panel2);
  color:var(--text-dim); display:flex; align-items:center; justify-content:center; font-size:15px;
  transition:.15s;
}
.icon-btn:hover{color:var(--text); border-color:var(--text-faint);}

/* ---------- Layout ---------- */
.app{display:flex; min-height:calc(100vh - 54px); position:relative; z-index:1;}
.sidebar{
  width:250px; flex-shrink:0; border-right:1px solid var(--border-soft);
  padding:16px 10px; position:sticky; top:54px; height:calc(100vh - 54px); overflow-y:auto;
  background:color-mix(in srgb, var(--bg2) 60%, transparent);
}
.sidebar h4{font-size:10.5px; text-transform:uppercase; letter-spacing:1px; color:var(--text-faint); padding:14px 10px 6px;}
.nav-item{
  display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:9px; font-size:13px;
  color:var(--text-dim); cursor:pointer; transition:.15s; margin-bottom:2px; border:1px solid transparent;
  position:relative;
}
.nav-item .n-ico{width:22px; text-align:center; font-size:13px; flex-shrink:0;}
.nav-item:hover{background:var(--panel2); color:var(--text);}
.nav-item.active{background:var(--red-glow); color:var(--text); border-color:var(--red-dim); font-weight:600;}
.nav-item.locked{opacity:.4; cursor:not-allowed;}
.nav-item.done .n-ico{color:var(--green);}
.nav-badge{margin-left:auto; font-size:10px; background:var(--panel); border:1px solid var(--border); padding:1px 6px; border-radius:8px; color:var(--text-faint);}
.nav-item.done .nav-badge{color:var(--green); border-color:var(--green-dim);}

.progress-mini{margin:10px 8px 4px; padding:10px; background:var(--panel); border:1px solid var(--border); border-radius:10px;}
.progress-mini .lbl{display:flex; justify-content:space-between; font-size:11px; color:var(--text-dim); margin-bottom:6px;}
.bar-track{height:6px; border-radius:5px; background:var(--border-soft); overflow:hidden;}
.bar-fill{height:100%; background:linear-gradient(90deg, var(--red), var(--orange)); border-radius:5px; transition:width .5s ease;}

.main{flex:1; min-width:0; padding:26px 30px 80px;}
.view{display:none; animation:fadeIn .35s ease;}
.view.active{display:block;}
@keyframes fadeIn{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);}}

.section-head{margin-bottom:22px;}
.eyebrow{font-size:11px; text-transform:uppercase; letter-spacing:1.5px; color:var(--red); font-weight:700; margin-bottom:6px;}
h1.page-title{font-size:26px; font-weight:800; letter-spacing:-.3px;}
.page-sub{color:var(--text-dim); font-size:13.5px; margin-top:5px; max-width:680px;}

.card{
  background:var(--panel); border:1px solid var(--border); border-radius:var(--radius);
  padding:20px; box-shadow:var(--shadow);
}
.grid{display:grid; gap:16px;}
.grid-2{grid-template-columns:1fr 1fr;}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-4{grid-template-columns:repeat(4,1fr);}
@media(max-width:1000px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr;}}

.btn{
  display:inline-flex; align-items:center; gap:8px; padding:11px 20px; border-radius:10px; border:none;
  font-weight:700; font-size:13.5px; transition:.15s;
}
.btn-primary{background:linear-gradient(135deg,var(--red),var(--red-dim)); color:#fff; box-shadow:0 6px 20px var(--red-glow);}
.btn-primary:hover{transform:translateY(-1px); box-shadow:0 10px 26px var(--red-glow);}
.btn-ghost{background:var(--panel2); color:var(--text); border:1px solid var(--border);}
.btn-ghost:hover{border-color:var(--text-faint);}
.btn-sm{padding:7px 13px; font-size:12px; border-radius:8px;}
.btn:disabled{opacity:.4; cursor:not-allowed; transform:none !important;}

.pill{display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:700; padding:3px 9px; border-radius:20px;}
.pill-green{background:rgba(61,220,132,.14); color:var(--green);}
.pill-red{background:rgba(255,59,48,.14); color:var(--red);}
.pill-orange{background:rgba(255,171,64,.14); color:var(--orange);}
.pill-blue{background:rgba(77,163,255,.14); color:var(--blue);}
.pill-gray{background:var(--panel2); color:var(--text-faint); border:1px solid var(--border);}

/* Toast */
#toast-wrap{position:fixed; bottom:22px; right:22px; z-index:9999; display:flex; flex-direction:column; gap:10px;}
.toast{
  background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:13px 16px;
  box-shadow:var(--shadow); display:flex; align-items:center; gap:10px; min-width:260px;
  animation:toastIn .3s ease; font-size:13px;
}
@keyframes toastIn{from{opacity:0; transform:translateX(30px);} to{opacity:1; transform:translateX(0);}}
.toast .t-ico{font-size:18px;}
.toast b{display:block; font-size:12.5px;}
.toast span{color:var(--text-dim); font-size:11.5px;}
.toast.xp b{color:var(--orange);}
.toast.ok .t-ico{color:var(--green);}
.toast.err .t-ico{color:var(--red);}

/* Console frame (signature motif) */
.console-frame{
  background:#0a0d12; border:1px solid #232b36; border-radius:12px; overflow:hidden;
  box-shadow: var(--shadow);
}
[data-theme="light"] .console-frame{background:#12161c;}
.console-topbar{
  display:flex; align-items:center; gap:8px; padding:9px 14px; background:#12161d; border-bottom:1px solid #232b36;
}
.console-dot{width:10px; height:10px; border-radius:50%;}
.console-topbar .url{
  margin-left:10px; flex:1; background:#0d1117; border:1px solid #232b36; border-radius:7px; padding:4px 10px;
  font-family:var(--mono); font-size:11px; color:#7d8b9c;
}
.console-body{display:flex; min-height:280px;}
.console-nav{width:170px; flex-shrink:0; border-right:1px solid #1c232d; padding:10px 6px; background:#0d1117;}
.console-nav-item{
  padding:9px 10px; font-size:12px; color:#8b98a8; border-radius:7px; margin-bottom:2px; display:flex; align-items:center; gap:8px;
  transition:.15s; cursor:pointer;
}
.console-nav-item:hover{background:#171e28; color:#e6ebf1;}
.console-nav-item.active{background:rgba(255,59,48,.15); color:#ff6b60; font-weight:600;}
.console-content{flex:1; padding:18px 20px; color:#c9d2dc; font-size:13px;}
.console-content h3{color:#fff; font-size:16px; margin-bottom:8px;}
.console-content p{color:#93a1b2; line-height:1.6; margin-bottom:10px; font-size:12.5px;}

/* Mission Map */
.mission-map{position:relative; padding:30px 10px;}
.mission-track{
  display:flex; flex-wrap:wrap; gap:20px; position:relative;
}
.m-node{
  width:220px; background:var(--panel); border:1px solid var(--border); border-radius:16px; padding:18px;
  position:relative; transition:.2s; cursor:pointer;
}
.m-node:hover{transform:translateY(-3px); border-color:var(--text-faint);}
.m-node.locked{opacity:.45; cursor:not-allowed; filter:grayscale(.6);}
.m-node.locked:hover{transform:none;}
.m-node.done{border-color:var(--green-dim); background:linear-gradient(180deg, rgba(61,220,132,.06), var(--panel));}
.m-node.current{border-color:var(--red-dim); box-shadow:0 0 0 3px var(--red-glow);}
.m-num{
  width:34px; height:34px; border-radius:10px; background:var(--panel2); border:1px solid var(--border);
  display:flex; align-items:center; justify-content:center; font-weight:800; font-size:13px; margin-bottom:10px;
}
.m-node.done .m-num{background:var(--green); color:#052e17; border-color:var(--green);}
.m-node.current .m-num{background:var(--red); color:#fff; border-color:var(--red);}
.m-node h4{font-size:14.5px; margin-bottom:4px;}
.m-node p{font-size:11.5px; color:var(--text-dim); line-height:1.5; margin-bottom:10px;}
.m-node .m-xp{font-size:11px; color:var(--orange); font-weight:700;}

/* Drag & Drop */
.dropzone{
  min-height:110px; border:2px dashed var(--border); border-radius:12px; padding:12px; display:flex; flex-wrap:wrap; gap:8px;
  align-content:flex-start; transition:.15s; background:var(--panel2);
}
.dropzone.over{border-color:var(--blue); background:rgba(77,163,255,.06);}
.dropzone.wrong{animation:shake .4s;}
.dropzone.correct{border-color:var(--green); background:rgba(61,220,132,.06);}
@keyframes shake{0%,100%{transform:translateX(0);}20%{transform:translateX(-8px);}40%{transform:translateX(8px);}60%{transform:translateX(-6px);}80%{transform:translateX(6px);}}
.drag-chip{
  padding:9px 14px; background:var(--panel); border:1px solid var(--border); border-radius:9px; font-size:12.5px; font-weight:600;
  cursor:grab; user-select:none; display:flex; align-items:center; gap:6px;
}
.drag-chip:active{cursor:grabbing;}
.drag-chip.placed{opacity:.35; pointer-events:none;}

/* Forms */
.field{margin-bottom:14px;}
.field label{display:block; font-size:12px; color:var(--text-dim); margin-bottom:6px; font-weight:600;}
.field input, .field select{
  width:100%; padding:10px 12px; border-radius:9px; border:1px solid var(--border); background:var(--panel2);
  color:var(--text); font-size:13px; font-family:inherit;
}
.field input:focus, .field select:focus{outline:none; border-color:var(--red-dim);}

/* Terminal */
.terminal{
  background:#0a0d12; border-radius:12px; border:1px solid #232b36; font-family:var(--mono); font-size:12.5px;
  padding:16px; min-height:260px; color:#3ddc84; overflow-y:auto; max-height:400px;
}
.terminal .line{margin-bottom:6px; line-height:1.6;}
.terminal .prompt{color:#4da3ff;}
.terminal .out{color:#c9d2dc;}
.terminal .comment{color:#5f6b7a;}
.term-input-row{display:flex; align-items:center; gap:6px; margin-top:4px;}
.term-input-row input{
  flex:1; background:transparent; border:none; color:#3ddc84; font-family:var(--mono); font-size:12.5px; outline:none;
}
.cursor-blink{width:7px; height:14px; background:#3ddc84; display:inline-block; animation:blink 1s infinite;}
@keyframes blink{50%{opacity:0;}}

/* Policy editor */
.policy-editor{
  background:#0a0d12; border-radius:12px; border:1px solid #232b36; font-family:var(--mono); font-size:13px;
  padding:16px; color:#c9d2dc; min-height:120px; line-height:1.9;
}
.tok-allow{color:#ff6b60; font-weight:700;}
.tok-group{color:#4da3ff;}
.tok-verb{color:#ffd54a; font-weight:700;}
.tok-resource{color:#3ddc84;}
.tok-scope{color:#b48bff; font-weight:700;}
.tok-name{color:#ffab40;}

/* Quiz */
.quiz-q{margin-bottom:22px; padding-bottom:18px; border-bottom:1px solid var(--border-soft);}
.quiz-q:last-child{border:none;}
.quiz-q .q-txt{font-weight:700; font-size:14px; margin-bottom:12px;}
.q-opt{
  display:flex; align-items:center; gap:10px; padding:11px 14px; border:1px solid var(--border); border-radius:10px;
  margin-bottom:8px; cursor:pointer; transition:.15s; font-size:13px;
}
.q-opt:hover{border-color:var(--text-faint);}
.q-opt.selected{border-color:var(--blue-dim); background:rgba(77,163,255,.08);}
.q-opt.correct{border-color:var(--green-dim); background:rgba(61,220,132,.1);}
.q-opt.incorrect{border-color:var(--red-dim); background:rgba(255,59,48,.1);}
.q-explain{
  margin-top:8px; padding:10px 12px; background:var(--panel2); border-radius:9px; font-size:12px; color:var(--text-dim);
  display:none; border-left:3px solid var(--blue-dim);
}
.q-explain.show{display:block;}

/* Achievements */
.ach-card{
  text-align:center; padding:22px 14px; border-radius:14px; border:1px solid var(--border); background:var(--panel);
  transition:.2s;
}
.ach-card.locked{opacity:.35; filter:grayscale(1);}
.ach-card .ico{font-size:34px; margin-bottom:10px;}
.ach-card h5{font-size:13px; margin-bottom:4px;}
.ach-card p{font-size:11px; color:var(--text-dim);}

/* Globe / regions */
.region-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px;}
.region-card{
  padding:14px; border-radius:12px; border:1px solid var(--border); background:var(--panel); cursor:pointer; transition:.15s;
  position:relative;
}
.region-card:hover{border-color:var(--blue-dim); transform:translateY(-2px);}
.region-card.home{border-color:var(--red-dim); background:linear-gradient(180deg, var(--red-glow), var(--panel));}
.region-card .flag{font-size:20px; margin-bottom:6px;}
.region-card h5{font-size:12.5px;}
.region-card small{color:var(--text-faint); font-size:10.5px;}

/* AD / FD */
.dc-row{display:flex; gap:18px; flex-wrap:wrap;}
.dc-building{
  flex:1; min-width:150px; background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:18px; text-align:center;
  cursor:pointer; transition:.2s; position:relative;
}
.dc-building:hover{border-color:var(--blue-dim);}
.dc-building.failed{border-color:var(--red-dim); background:rgba(255,59,48,.06);}
.dc-building .ico{font-size:30px; margin-bottom:8px;}
.dc-building.active-glow{box-shadow:0 0 0 3px rgba(61,220,132,.25); border-color:var(--green-dim);}

/* Relationship graph */
.rgraph{display:flex; align-items:center; justify-content:center; gap:0; flex-wrap:wrap; padding:20px 0;}
.rg-col{display:flex; flex-direction:column; gap:12px; align-items:center;}
.rg-node{
  padding:10px 16px; border-radius:10px; border:1px solid var(--border); background:var(--panel2); font-size:12px; font-weight:600;
  white-space:nowrap;
}
.rg-arrow{color:var(--text-faint); font-size:20px; padding:0 18px;}

/* misc */
.kbd{font-family:var(--mono); background:var(--panel2); border:1px solid var(--border); padding:1px 6px; border-radius:5px; font-size:11px;}
.hr{height:1px; background:var(--border-soft); margin:20px 0;}
.two-col{display:grid; grid-template-columns:1fr 1fr; gap:18px;}
@media(max-width:900px){.two-col{grid-template-columns:1fr;} .sidebar{display:none;}}
.tag-list{display:flex; flex-wrap:wrap; gap:8px;}
.info-box{padding:12px 14px; border-radius:10px; border-left:3px solid var(--blue-dim); background:rgba(77,163,255,.06); font-size:12.5px; margin:12px 0;}
.tip-box{padding:12px 14px; border-radius:10px; border-left:3px solid var(--orange); background:rgba(255,171,64,.07); font-size:12.5px; margin:12px 0;}
.mistake-box{padding:12px 14px; border-radius:10px; border-left:3px solid var(--red); background:rgba(255,59,48,.06); font-size:12.5px; margin:12px 0;}
.hidden{display:none !important;}
</style>
</head>
<body data-theme="dark">

<div id="toast-wrap"></div>

<!-- TOP BAR -->
<div class="topbar">
  <div class="brand"><div class="logo">C</div><div>OCI IAM Lab <small>1Z0-1067-26 · Day 1</small></div></div>

</div>

<div class="app">
  <!-- SIDEBAR -->
  <div class="sidebar" id="sidebar"></div>

  <!-- MAIN -->
  <div class="main" id="main"></div>
</div>

<script>
/* ================= DATA ================= */

const NAV = [
  {id:'home', label:'Mission Control', ico:'⌂', group:'main'},
  {id:'missionmap', label:'Mission Map', ico:'🗺', group:'main'},
  {id:'console', label:'OCI Console Explorer', ico:'☁', group:'explore'},

  {id:'m2', label:'M2 · Compartments', ico:'②', group:'missions'},
  {id:'m3', label:'M3 · Create Users', ico:'③', group:'missions'},
  {id:'m4', label:'M4 · Groups', ico:'④', group:'missions'},
  {id:'m5', label:'M5 · Assign Users', ico:'⑤', group:'missions'},
  {id:'m6', label:'M6 · Policy Builder', ico:'⑥', group:'missions'},
  {id:'m7', label:'M7 · Policy Simulator', ico:'⑦', group:'missions'},

  {id:'challenges', label:'Real-World Challenges', ico:'🧩', group:'extra'},
  {id:'achievements', label:'Achievements', ico:'🏆', group:'extra'},
  {id:'dashboard', label:'Dashboard', ico:'📊', group:'extra'},
  {id:'capstone', label:'Final Capstone', ico:'🎓', group:'extra'},
];

const MISSIONS = [
  {id:'m1', num:1, title:'Create OCI Account', desc:'Simulate signing up for OCI Free Tier.', xp:100},
  {id:'m2', num:2, title:'Create Compartments', desc:'Build the Dev / Test / Prod hierarchy.', xp:120},
  {id:'m3', num:3, title:'Create Users', desc:'Provision AdminUser, DevUser, Auditor.', xp:120},
  {id:'m4', num:4, title:'Create Groups', desc:'Administrators, Developers, Auditors.', xp:100},
  {id:'m5', num:5, title:'Assign Users to Groups', desc:'Drag-and-drop assignment challenge.', xp:130},
  {id:'m6', num:6, title:'IAM Policy Builder', desc:'Write real OCI policy statements.', xp:150},
  {id:'m7', num:7, title:'Policy Simulator', desc:'Test who can do what, and why.', xp:150},
  {id:'m8', num:8, title:'OCI CLI', desc:'Run identity commands in Cloud Shell.', xp:130},

const MISSION_ORDER = ['m1','m2','m3','m4','m5','m6','m7','m8'];

function isUnlocked(id){
  const idx = MISSION_ORDER.indexOf(id);
  if(idx<=0) return true;
  return STATE.done.has(MISSION_ORDER[idx-1]);
}

function rankFor(xp){
  if(xp>=1000) return 'OCI IAM Expert';
  if(xp>=700) return 'Security Architect';
  if(xp>=400) return 'Cloud Engineer';
  if(xp>=150) return 'Associate';
  return 'Recruit';
}

function addXP(n, label){
  STATE.xp += n;
  document.getElementById('xpDisplay').textContent = STATE.xp;
  document.getElementById('rankChip').textContent = rankFor(STATE.xp);
  toast('xp', `+${n} XP`, label||'Nice work!');
  checkAchievements();
}

function toast(type, title, msg){
  const wrap = document.getElementById('toast-wrap');
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  const ico = type==='xp' ? '⭐' : type==='ok' ? '✅' : type==='err' ? '⛔' : 'ℹ';
  el.innerHTML = `<div class="t-ico">${ico}</div><div><b>${title}</b><span>${msg||''}</span></div>`;
  wrap.appendChild(el);
  setTimeout(()=>{ el.style.transition='opacity .4s'; el.style.opacity='0'; setTimeout(()=>el.remove(),400); }, 3200);
}

function completeMission(id, xp){
  if(STATE.done.has(id)) return;
  STATE.done.add(id);
  addXP(xp, MISSIONS.find(m=>m.id===id).title + ' complete');
  toast('ok','Mission Complete', MISSIONS.find(m=>m.id===id).title);
  renderSidebar();
  const idx = MISSION_ORDER.indexOf(id);
  if(idx>=0 && idx<MISSION_ORDER.length-1){
    setTimeout(()=>toast('info','Next mission unlocked', MISSIONS[idx+1].title), 900);
  }
}

function checkAchievements(){
  ACHIEVEMENTS.forEach(a=>{
    if(!STATE.achUnlocked.has(a.id) && a.check(STATE)){
      STATE.achUnlocked.add(a.id);
      setTimeout(()=>toast('ok','Achievement Unlocked 🏆', a.name), 600);
    }
  });
}

/* ================= NAV / SIDEBAR ================= */
function renderSidebar(){
  const groups = {main:'Overview', explore:'Explore OCI', missions:'Mission Track', extra:'Beyond the Labs'};
  let html = '';
  Object.keys(groups).forEach(g=>{
    html += `<h4>${groups[g]}</h4>`;
    NAV.filter(n=>n.group===g).forEach(n=>{
      let locked = false, done = false;
      if(MISSION_ORDER.includes(n.id)){
        locked = !isUnlocked(n.id);
        done = STATE.done.has(n.id);
      }
      html += `<div class="nav-item ${STATE.view===n.id?'active':''} ${locked?'locked':''} ${done?'done':''}"
        onclick="${locked?'':`setView('${n.id}')`}">
        <span class="n-ico">${done?'✓':n.ico}</span>${n.label}
        ${locked?'<span class=\"nav-badge\">🔒</span>':''}
      </div>`;
    });
  });
  const pct = Math.round((STATE.done.size/MISSION_ORDER.length)*100);
  html += `<div class="progress-mini">
    <div class="lbl"><span>Mission Progress</span><span>${pct}%</span></div>
    <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
  </div>`;
  document.getElementById('sidebar').innerHTML = html;
}

function setView(id){
  STATE.view = id;
  const nav = NAV.find(n=>n.id===id);
  document.getElementById('crumbCurrent').textContent = nav ? nav.label : id;
  renderSidebar();
  renderMain();
  const mainEl = document.getElementById('main');
  if(mainEl.scrollIntoView) mainEl.scrollIntoView({behavior:'smooth', block:'start'});
}

function renderMain(){
  const map = {
    home:renderHome, missionmap:renderMissionMap, console:renderConsoleView,
    regions:renderRegions, ad:renderAD, fd:renderFD,
    m1:renderM1, m2:renderM2, m3:renderM3, m4:renderM4, m5:renderM5, m6:renderM6, m7:renderM7, m8:renderM8,
    cliconfig:renderCliConfig, challenges:renderChallenges, achievements:renderAchievements,
    dashboard:renderDashboard, capstone:renderCapstone,
  };
  const fn = map[STATE.view] || renderHome;
  document.getElementById('main').innerHTML = `<div class="view active">${fn()}</div>`;
  afterRenderHooks[STATE.view] && afterRenderHooks[STATE.view]();
}

function renderM7(){

  return `

function testM7(i){

  document.getElementById('m7res-'+i).innerHTML = `<span class="pill ${allowed?'pill-green':'pill-red'}">${allowed?'✓ Allowed':'⛔ Denied'}</span><p class="page-sub" style="margin-top:8px;">${reason}</p>`;

  </div>
  <div class="terminal" id="terminal">
    ${STATE.m8.history.map(h=>`<div class="line"><span class="prompt">$</span> ${h.cmd}</div><div class="line out">${h.out.replace(/\n/g,'<br>')}</div><div class="line comment">${h.note}</div>`).join('')}
    ${step<CLI_STEPS.length ? `<div class="line"><span class="prompt">$</span> <span style="color:var(--text-faint);">${CLI_STEPS[step].cmd}</span></div>` : ''}
  </div>
  <div style="margin-top:14px;">
    ${step<CLI_STEPS.length ? `<button class="btn btn-primary" onclick="runM8Step()">▶ Run: ${CLI_STEPS[step].cmd}</button>` : `<span class="pill pill-green">All commands executed</span>`}
  </div>
  ${step>=CLI_STEPS.length && !done ? `<div style="margin-top:16px;"><button class="btn btn-primary" onclick="completeMission('m8',130); renderMain();">✓ Complete Mission</button></div>` : ''}
  ${done ? renderQuizBlock('m8') : ''}`;
}
function runM8Step(){
  const s = CLI_STEPS[STATE.m8.step];
  STATE.m8.history.push(s);
  STATE.m8.step++;
  addXP(10, s.cmd);
  renderMain();
}

/* ================= CLI CONFIG SIMULATOR ================= */
const CLI_CONFIG_FIELDS = [
  {key:'tenancy', label:'Tenancy OCID', ph:'ocid1.tenancy.oc1..aaaaaaaa...'},
  {key:'user', label:'User OCID', ph:'ocid1.user.oc1..aaaaaaaa...'},
  {key:'region', label:'Region', ph:'us-ashburn-1'},
  {key:'fingerprint', label:'Fingerprint', ph:'a1:b2:c3:d4:...'},
  {key:'key_file', label:'Private Key Path', ph:'~/.oci/oci_api_key.pem'},
];
function renderCliConfig(){
  return `
  <div class="section-head">
    <div class="eyebrow">CLI Configuration Simulator</div>
    <h1 class="page-title">Build ~/.oci/config</h1>
    <p class="page-sub">Paste each value. This mirrors the "oci setup config" wizard.</p>
  </div>
  <div class="two-col">
    <div class="card">
      ${CLI_CONFIG_FIELDS.map(f=>`<div class="field"><label>${f.label}</label><input id="cfg-${f.key}" placeholder="${f.ph}" oninput="updateCliConfig()"></div>`).join('')}
    </div>
    <div class="card">
      <h4 style="margin-bottom:10px;">~/.oci/config</h4>
      <div class="terminal" id="cliConfigPreview" style="min-height:180px;">[DEFAULT]<br>tenancy=<br>user=<br>region=<br>fingerprint=<br>key_file=</div>
      <div id="cliConfigExplain" class="info-box" style="margin-top:12px;">Fill in each field — every one is explained here as you type.</div>
    </div>
  </div>`;
}
function updateCliConfig(){
  const vals = {};
  CLI_CONFIG_FIELDS.forEach(f=>{ vals[f.key] = document.getElementById('cfg-'+f.key).value || ''; });
  document.getElementById('cliConfigPreview').innerHTML =
    `[DEFAULT]<br>tenancy=${vals.tenancy}<br>user=${vals.user}<br>region=${vals.region}<br>fingerprint=${vals.fingerprint}<br>key_file=${vals.key_file}`;
  const filled = Object.values(vals).filter(v=>v.trim()).length;
  if(filled===5 && !STATE.cliConfigDone){
    STATE.cliConfigDone = true;
    addXP(40,'CLI config completed');
  }
  const explains = {
    tenancy:'Uniquely identifies your OCI tenancy — found on the Tenancy Details page.',
    user:'Uniquely identifies the IAM user the CLI authenticates as.',
    region:'The default region CLI commands run against.',
    fingerprint:'A hash of your public API key, generated when you add the key to your user.',
    key_file:'Local path to the private key half of your API signing key pair — never share this file.',
  };
  const last = CLI_CONFIG_FIELDS.slice().reverse().find(f=>vals[f.key].trim());
  if(last) document.getElementById('cliConfigExplain').innerHTML = `<b>${last.label}:</b> ${explains[last.key]}`;
}

/* ================= CHALLENGES ================= */
function renderChallenges(){
  return `
  <div class="section-head">
    <div class="eyebrow">Real-World Challenges</div>
    <h1 class="page-title">Troubleshooting Scenarios</h1>
    <p class="page-sub">Diagnose each real-world IAM problem. ${STATE.challengesDone.size}/5 solved.</p>
  </div>
  ${CHALLENGES.map(c=>`
    <div class="card" style="margin-bottom:14px;">
      <h4 style="margin-bottom:6px;">${c.title} ${STATE.challengesDone.has(c.id)?'<span class="pill pill-green">Solved</span>':''}</h4>
      <p class="page-sub" style="margin-bottom:12px;">${c.scenario}</p>
      <div id="chal-${c.id}">
        ${c.opts.map((o,i)=>`<div class="q-opt" onclick="answerChallenge('${c.id}',${i})">${o}</div>`).join('')}
        <div class="q-explain" id="chalex-${c.id}">${c.ex}</div>
      </div>
    </div>`).join('')}`;
}
function answerChallenge(id, idx){
  const c = CHALLENGES.find(x=>x.id===id);
  const container = document.getElementById('chal-'+id);
  const opts = container.querySelectorAll('.q-opt');
  opts.forEach((o,i)=>{
    o.onclick = null;
    if(i===c.a) o.classList.add('correct');
    else if(i===idx) o.classList.add('incorrect');
  });
  document.getElementById('chalex-'+id).classList.add('show');
  if(idx===c.a){
    if(!STATE.challengesDone.has(id)){ STATE.challengesDone.add(id); addXP(30, c.title+' solved'); }
  } else {
    toast('err','Not quite','Check the explanation below.');
  }
  renderSidebar();
}

/* ================= ACHIEVEMENTS ================= */
function renderAchievements(){
  return `
  <div class="section-head">
    <div class="eyebrow">Achievements</div>
    <h1 class="page-title">Trophy Case</h1>
    <p class="page-sub">${STATE.achUnlocked.size}/${ACHIEVEMENTS.length} unlocked</p>
  </div>
  <div class="grid grid-4">
    ${ACHIEVEMENTS.map(a=>{
      const unlocked = STATE.achUnlocked.has(a.id);
      return `<div class="ach-card ${unlocked?'':'locked'}"><div class="ico">${a.ico}</div><h5>${a.name}</h5><p>${unlocked?'Unlocked':a.cond}</p></div>`;

}

    <div class="card"><div class="pill pill-green">Labs Completed</div><h2 style="margin-top:10px;">${STATE.done.size}</h2></div>

    <div class="card"><div class="pill pill-orange">Total XP</div><h2 style="margin-top:10px;">${STATE.xp}</h2></div>

}

  const checklist = [
    {label:'Create compartments (Dev/Test/Prod)', ok:STATE.done.has('m2')},

    {label:'Assign users to groups', ok:STATE.done.has('m5')},
    {label:'Write IAM policies', ok:STATE.done.has('m6')},
    {label:'Test permissions in simulator', ok:STATE.done.has('m7')},

  return `

    <h1 class="page-title">Enterprise IAM Build-Out</h1>

  </div>

  <div class="card" style="text-align:center; margin-top:18px; padding:44px; background:linear-gradient(180deg, rgba(61,220,132,.12), var(--panel));">

    <h2 style="margin-bottom:8px;">Mission Complete — OCI IAM Expert</h2>
    <p class="page-sub" style="margin-bottom:14px;">Certification Ready · XP ${STATE.xp}</p>
    <div class="pill pill-green" style="font-size:13px; padding:8px 16px;">Certification Ready</div>
  </div>` : `<div class="tip-box" style="margin-top:16px;">Complete all 8 missions to unlock your capstone certificate.</div>`}`;
}

/* ================= QUIZ BLOCK (reused per mission) ================= */
function renderQuizBlock(missionId){
  const qs = QUIZZES[missionId];
  if(!qs) return '';
  const answered = STATE.quizAnswered[missionId] || {};
  return `
  <div class="card" style="margin-top:20px;">
    <h4 style="margin-bottom:14px;">🎯 Knowledge Check</h4>
    ${qs.map((q,qi)=>`
      <div class="quiz-q">
        <div class="q-txt">${qi+1}. ${q.q}</div>
        ${q.opts.map((o,oi)=>`<div class="q-opt ${answered[qi]===oi?(oi===q.a?'correct':'incorrect'):''}" onclick="answerQuiz('${missionId}',${qi},${oi})">${o}</div>`).join('')}
        <div class="q-explain ${answered[qi]!==undefined?'show':''}">${q.ex}</div>
      </div>`).join('')}
  </div>`;
}
function answerQuiz(missionId, qi, oi){
  if(!STATE.quizAnswered[missionId]) STATE.quizAnswered[missionId] = {};
  if(STATE.quizAnswered[missionId][qi] !== undefined) return;
  STATE.quizAnswered[missionId][qi] = oi;
  const q = QUIZZES[missionId][qi];
  if(oi===q.a){
    STATE.quizScores[missionId] = (STATE.quizScores[missionId]||0)+1;
    addXP(10,'Correct answer');
  } else {
    toast('err','Not quite','Review the explanation.');
  }
  renderMain();
}

/* ================= INIT ================= */
function toggleTheme(){
  STATE.theme = STATE.theme==='dark' ? 'light' : 'dark';
  document.body.setAttribute('data-theme', STATE.theme);
}
document.getElementById('themeToggle').addEventListener('click', toggleTheme);
renderSidebar();
renderMain();
window.STATE = STATE; // debug/introspection hook

</script>
