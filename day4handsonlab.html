<!DOCTYPE html>
<html lang="en">
<head>

<title>Day 4 Lab — Terraform &amp; OCI Resource Manager | 1Z0-1067-26</title>
<style>
:root{
  --bg:#0d1117; --bg2:#11161d; --panel:#151b23; --panel2:#1a212b;
  --border:#232b36; --border-soft:#1d2530;
  --text:#e6ebf1; --text-dim:#9aa7b6; --text-faint:#5f6b7a;
  --red:#ff3b30; --red-dim:#c62b22; --red-glow:rgba(255,59,48,.25);
  --blue:#4da3ff; --blue-dim:#2f6fd1;
  --orange:#ffab40; --green:#3ddc84; --green-dim:#279a5c;
  --yellow:#ffd54a; --purple:#b48bff;
  --radius:14px; --radius-sm:9px;
  --shadow: 0 8px 30px rgba(0,0,0,.35);
  --mono: 'SFMono-Regular', Consolas, 'Courier New', monospace;
  --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif;
}
[data-theme="light"]{
  --bg:#f4f5f7; --bg2:#eceef1; --panel:#ffffff; --panel2:#f7f8fa;
  --border:#e1e4e9; --border-soft:#ebedf0;
  --text:#1b2129; --text-dim:#5b6572; --text-faint:#8b95a3;
  --red:#e0342a; --red-dim:#c62b22; --red-glow:rgba(224,52,42,.18);
  --shadow: 0 8px 30px rgba(20,20,30,.08);
}
*{box-sizing:border-box; margin:0; padding:0;}
html{scroll-behavior:smooth;}
body{background:var(--bg); color:var(--text); font-family:var(--sans); min-height:100vh; overflow-x:hidden; transition:background .3s,color .3s;}
body::before{content:''; position:fixed; inset:0; pointer-events:none; z-index:0;
  background: radial-gradient(circle at 15% 10%, var(--red-glow), transparent 40%), radial-gradient(circle at 85% 90%, rgba(77,163,255,.10), transparent 45%);}
::-webkit-scrollbar{width:10px; height:10px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border); border-radius:10px;}
a{color:inherit;} button{font-family:inherit; cursor:pointer;}

.topbar{position:sticky; top:0; z-index:100; display:flex; align-items:center; gap:14px; padding:10px 18px;
  background:color-mix(in srgb, var(--panel) 88%, transparent); backdrop-filter:blur(14px); border-bottom:1px solid var(--border-soft);}
.brand{display:flex; align-items:center; gap:10px; font-weight:700;}
.brand .logo{width:30px; height:30px; border-radius:8px; background:linear-gradient(135deg, var(--red), var(--red-dim));
  display:flex; align-items:center; justify-content:center; font-size:13px; color:#fff; font-weight:800; box-shadow:0 4px 14px var(--red-glow);}
.brand small{display:block; font-weight:500; color:var(--text-faint); font-size:10.5px; letter-spacing:.5px;}
.crumb{display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--text-dim); flex:1; min-width:0; overflow:hidden; white-space:nowrap;}
.crumb b{color:var(--text); font-weight:600;}
.topbar-right{display:flex; align-items:center; gap:10px;}
.xp-chip{display:flex; align-items:center; gap:7px; background:var(--panel2); border:1px solid var(--border); padding:6px 12px; border-radius:20px; font-size:12.5px; font-weight:600;}
.xp-chip .dot{width:7px; height:7px; border-radius:50%; background:var(--orange); box-shadow:0 0 8px var(--orange);}
.rank-chip{background:linear-gradient(135deg, var(--red), var(--red-dim)); color:#fff; font-size:11.5px; font-weight:700; padding:6px 11px; border-radius:20px;}
.icon-btn{width:34px; height:34px; border-radius:9px; border:1px solid var(--border); background:var(--panel2); color:var(--text-dim); display:flex; align-items:center; justify-content:center; font-size:15px; transition:.15s;}
.icon-btn:hover{color:var(--text); border-color:var(--text-faint);}

.app{display:flex; min-height:calc(100vh - 54px); position:relative; z-index:1;}
.sidebar{width:255px; flex-shrink:0; border-right:1px solid var(--border-soft); padding:16px 10px; position:sticky; top:54px; height:calc(100vh - 54px); overflow-y:auto; background:color-mix(in srgb, var(--bg2) 60%, transparent);}
.sidebar h4{font-size:10.5px; text-transform:uppercase; letter-spacing:1px; color:var(--text-faint); padding:14px 10px 6px;}
.nav-item{display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:9px; font-size:12.5px; color:var(--text-dim); cursor:pointer; transition:.15s; margin-bottom:2px; border:1px solid transparent;}
.nav-item .n-ico{width:22px; text-align:center; font-size:12.5px; flex-shrink:0;}
.nav-item:hover{background:var(--panel2); color:var(--text);}
.nav-item.active{background:var(--red-glow); color:var(--text); border-color:var(--red-dim); font-weight:600;}
.nav-item.locked{opacity:.4; cursor:not-allowed;}
.nav-item.done .n-ico{color:var(--green);}
.nav-badge{margin-left:auto; font-size:10px; background:var(--panel); border:1px solid var(--border); padding:1px 6px; border-radius:8px; color:var(--text-faint);}
.nav-item.done .nav-badge{color:var(--green); border-color:var(--green-dim);}
.progress-mini{margin:10px 8px 4px; padding:10px; background:var(--panel); border:1px solid var(--border); border-radius:10px;}
.progress-mini .lbl{display:flex; justify-content:space-between; font-size:11px; color:var(--text-dim); margin-bottom:6px;}
.bar-track{height:6px; border-radius:5px; background:var(--border-soft); overflow:hidden;}
.bar-fill{height:100%; background:linear-gradient(90deg, var(--red), var(--orange)); border-radius:5px; transition:width .5s ease;}

.main{flex:1; min-width:0; padding:26px 30px 80px;}
.view{display:none; animation:fadeIn .35s ease;}
.view.active{display:block;}
@keyframes fadeIn{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);}}
.section-head{margin-bottom:22px;}
.eyebrow{font-size:11px; text-transform:uppercase; letter-spacing:1.5px; color:var(--red); font-weight:700; margin-bottom:6px;}
h1.page-title{font-size:25px; font-weight:800; letter-spacing:-.3px;}
.page-sub{color:var(--text-dim); font-size:13.5px; margin-top:5px; max-width:700px;}
.card{background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); padding:20px; box-shadow:var(--shadow);}
.grid{display:grid; gap:16px;}
.grid-2{grid-template-columns:1fr 1fr;} .grid-3{grid-template-columns:repeat(3,1fr);} .grid-4{grid-template-columns:repeat(4,1fr);} .grid-6{grid-template-columns:repeat(6,1fr);}
@media(max-width:1000px){.grid-2,.grid-3,.grid-4,.grid-6{grid-template-columns:1fr 1fr;}}
@media(max-width:650px){.grid-2,.grid-3,.grid-4,.grid-6{grid-template-columns:1fr;}}
.btn{display:inline-flex; align-items:center; gap:8px; padding:11px 20px; border-radius:10px; border:none; font-weight:700; font-size:13.5px; transition:.15s;}
.btn-primary{background:linear-gradient(135deg,var(--red),var(--red-dim)); color:#fff; box-shadow:0 6px 20px var(--red-glow);}
.btn-primary:hover{transform:translateY(-1px); box-shadow:0 10px 26px var(--red-glow);}
.btn-ghost{background:var(--panel2); color:var(--text); border:1px solid var(--border);}
.btn-ghost:hover{border-color:var(--text-faint);}
.btn-sm{padding:7px 13px; font-size:12px; border-radius:8px;}
.btn:disabled{opacity:.4; cursor:not-allowed; transform:none !important;}
.pill{display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:700; padding:3px 9px; border-radius:20px;}
.pill-green{background:rgba(61,220,132,.14); color:var(--green);}
.pill-red{background:rgba(255,59,48,.14); color:var(--red);}
.pill-orange{background:rgba(255,171,64,.14); color:var(--orange);}
.pill-blue{background:rgba(77,163,255,.14); color:var(--blue);}
.pill-purple{background:rgba(180,139,255,.14); color:var(--purple);}
.pill-gray{background:var(--panel2); color:var(--text-faint); border:1px solid var(--border);}
#toast-wrap{position:fixed; bottom:22px; right:22px; z-index:9999; display:flex; flex-direction:column; gap:10px;}
.toast{background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:13px 16px; box-shadow:var(--shadow); display:flex; align-items:center; gap:10px; min-width:260px; animation:toastIn .3s ease; font-size:13px;}
@keyframes toastIn{from{opacity:0; transform:translateX(30px);} to{opacity:1; transform:translateX(0);}}
.toast .t-ico{font-size:18px;} .toast b{display:block; font-size:12.5px;} .toast span{color:var(--text-dim); font-size:11.5px;}
.toast.xp b{color:var(--orange);} .toast.ok .t-ico{color:var(--green);} .toast.err .t-ico{color:var(--red);}

.mission-map{position:relative; padding:20px 10px;}
.mission-track{display:flex; flex-wrap:wrap; gap:18px;}
.m-node{width:205px; background:var(--panel); border:1px solid var(--border); border-radius:16px; padding:16px; position:relative; transition:.2s; cursor:pointer;}
.m-node:hover{transform:translateY(-3px); border-color:var(--text-faint);}
.m-node.locked{opacity:.45; cursor:not-allowed; filter:grayscale(.6);}
.m-node.locked:hover{transform:none;}
.m-node.done{border-color:var(--green-dim); background:linear-gradient(180deg, rgba(61,220,132,.06), var(--panel));}
.m-node.current{border-color:var(--red-dim); box-shadow:0 0 0 3px var(--red-glow);}
.m-num{width:32px; height:32px; border-radius:10px; background:var(--panel2); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:12px; margin-bottom:8px;}
.m-node.done .m-num{background:var(--green); color:#052e17; border-color:var(--green);}
.m-node.current .m-num{background:var(--red); color:#fff; border-color:var(--red);}
.m-node h4{font-size:13.5px; margin-bottom:4px;}
.m-node p{font-size:11px; color:var(--text-dim); line-height:1.5; margin-bottom:8px;}
.m-node .m-xp{font-size:10.5px; color:var(--orange); font-weight:700;}

.terminal{background:#0a0d12; border-radius:12px; border:1px solid #232b36; font-family:var(--mono); font-size:12.5px; padding:16px; min-height:220px; color:#3ddc84; overflow-y:auto; max-height:420px;}
.terminal .line{margin-bottom:6px; line-height:1.6; white-space:pre-wrap;}
.terminal .prompt{color:#4da3ff;} .terminal .out{color:#c9d2dc;} .terminal .comment{color:#5f6b7a;} .terminal .errline{color:#ff6b60;}

.field{margin-bottom:14px;}
.field label{display:block; font-size:12px; color:var(--text-dim); margin-bottom:6px; font-weight:600;}
.field input, .field select, .field textarea{width:100%; padding:10px 12px; border-radius:9px; border:1px solid var(--border); background:var(--panel2); color:var(--text); font-size:13px; font-family:inherit;}
.field textarea{font-family:var(--mono); font-size:12px; min-height:90px; resize:vertical;}
.field input:focus, .field select:focus, .field textarea:focus{outline:none; border-color:var(--red-dim);}

.hr{height:1px; background:var(--border-soft); margin:20px 0;}
.two-col{display:grid; grid-template-columns:1fr 1fr; gap:18px;}
@media(max-width:900px){.two-col{grid-template-columns:1fr;} .sidebar{display:none;}}
.tag-list{display:flex; flex-wrap:wrap; gap:8px;}
.info-box{padding:12px 14px; border-radius:10px; border-left:3px solid var(--blue-dim); background:rgba(77,163,255,.06); font-size:12.5px; margin:12px 0;}
.tip-box{padding:12px 14px; border-radius:10px; border-left:3px solid var(--orange); background:rgba(255,171,64,.07); font-size:12.5px; margin:12px 0;}
.mistake-box{padding:12px 14px; border-radius:10px; border-left:3px solid var(--red); background:rgba(255,59,48,.06); font-size:12.5px; margin:12px 0;}
.hidden{display:none !important;}
.chip-row{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px;}
.chip{padding:8px 13px; background:var(--panel2); border:1px solid var(--border); border-radius:8px; font-size:12px; font-weight:600; cursor:pointer; transition:.15s;}
.chip:hover{border-color:var(--text-faint);}
.chip.active{background:var(--red-glow); border-color:var(--red-dim);}
.code-block{background:#0a0d12; border:1px solid #232b36; border-radius:10px; padding:14px; font-family:var(--mono); font-size:12px; color:#c9d2dc; overflow-x:auto; white-space:pre;}
.tok-key{color:#ff6b60;} .tok-str{color:#3ddc84;} .tok-com{color:#5f6b7a;} .tok-attr{color:#4da3ff;} .tok-block{color:#ffab40; font-weight:700;}

.quiz-q{margin-bottom:20px; padding-bottom:16px; border-bottom:1px solid var(--border-soft);}
.quiz-q:last-child{border:none;}
.quiz-q .q-txt{font-weight:700; font-size:14px; margin-bottom:12px;}
.q-opt{display:flex; align-items:center; gap:10px; padding:11px 14px; border:1px solid var(--border); border-radius:10px; margin-bottom:8px; cursor:pointer; transition:.15s; font-size:13px;}
.q-opt:hover{border-color:var(--text-faint);}
.q-opt.correct{border-color:var(--green-dim); background:rgba(61,220,132,.1);}
.q-opt.incorrect{border-color:var(--red-dim); background:rgba(255,59,48,.1);}
.q-explain{margin-top:8px; padding:10px 12px; background:var(--panel2); border-radius:9px; font-size:12px; color:var(--text-dim); display:none; border-left:3px solid var(--blue-dim);}
.q-explain.show{display:block;}

.ach-card{text-align:center; padding:20px 12px; border-radius:14px; border:1px solid var(--border); background:var(--panel); transition:.2s;}
.ach-card.locked{opacity:.35; filter:grayscale(1);}
.ach-card .ico{font-size:32px; margin-bottom:8px;}
.ach-card h5{font-size:12.5px; margin-bottom:4px;}
.ach-card p{font-size:10.5px; color:var(--text-dim);}

/* File explorer */
.file-tree{display:flex; flex-direction:column; gap:6px;}
.file-item{display:flex; align-items:center; gap:10px; padding:10px 12px; border:1px solid var(--border); border-radius:9px; background:var(--panel2); cursor:pointer; transition:.15s;}
.file-item:hover{border-color:var(--text-faint);}
.file-item.created{border-color:var(--green-dim); background:rgba(61,220,132,.06);}
.file-item .fi-ico{width:20px; text-align:center;}
.file-item .fi-name{font-family:var(--mono); font-weight:700; font-size:12.5px;}
.file-item .fi-desc{color:var(--text-dim); font-size:11px; margin-left:auto; text-align:right; max-width:55%;}

/* Architecture diagram */
.arch-diagram{display:flex; flex-direction:column; align-items:center; gap:0; padding:20px 0;}
.arch-node{padding:12px 22px; border-radius:12px; border:2px solid var(--border); background:var(--panel2); font-weight:700; font-size:13px; cursor:pointer; transition:.2s; text-align:center; min-width:160px;}
.arch-node.active{border-color:var(--green-dim); background:rgba(61,220,132,.08); box-shadow:0 0 0 3px rgba(61,220,132,.15);}
.arch-node.pending{opacity:.35;}
.arch-arrow{font-size:20px; color:var(--text-faint); padding:4px 0;}
.arch-row{display:flex; gap:14px; flex-wrap:wrap; justify-content:center;}

/* Plan visualizer */
.plan-row{display:flex; align-items:center; gap:10px; padding:9px 12px; border:1px solid var(--border); border-radius:9px; margin-bottom:6px; background:var(--panel2); font-size:12.5px;}
.plan-badge{font-size:10px; font-weight:800; padding:2px 8px; border-radius:6px; text-transform:uppercase;}
.plan-badge.create{background:rgba(61,220,132,.18); color:var(--green);}
.plan-badge.update{background:rgba(255,171,64,.18); color:var(--orange);}
.plan-badge.delete{background:rgba(255,59,48,.18); color:var(--red);}
.plan-badge.modify{background:rgba(77,163,255,.18); color:var(--blue);}

/* Pipeline */
.pipeline{display:flex; align-items:center; gap:6px; flex-wrap:wrap;}
.pipe-stage{padding:11px 14px; border-radius:10px; border:1px solid var(--border); background:var(--panel2); font-size:12px; font-weight:700; text-align:center; min-width:110px;}
.pipe-stage.done{border-color:var(--green-dim); background:rgba(61,220,132,.08); color:var(--green);}
.pipe-stage.failed{border-color:var(--red-dim); background:rgba(255,59,48,.08); color:var(--red);}
.pipe-stage.active{border-color:var(--blue-dim); box-shadow:0 0 0 3px rgba(77,163,255,.15);}
.pipe-arrow{color:var(--text-faint); font-size:16px;}

/* Drift */
.drift-row{display:flex; justify-content:space-between; align-items:center; padding:10px 12px; border:1px solid var(--border); border-radius:9px; margin-bottom:6px; background:var(--panel2); font-size:12.5px;}
.drift-row.mismatch{border-color:var(--red-dim); background:rgba(255,59,48,.06);}
.drift-row.match{border-color:var(--green-dim);}

.state-json{background:#0a0d12; border:1px solid #232b36; border-radius:10px; padding:14px; font-family:var(--mono); font-size:11.5px; color:#c9d2dc; max-height:320px; overflow:auto; white-space:pre;}
</style>
</head>

<script>
/* ================= DATA ================= */
const NAV = [
  {id:'home', label:'Mission Control', ico:'⌂', group:'main'},
  {id:'missionmap', label:'Mission Map', ico:'🗺', group:'main'},

  {id:'m5', label:'M5 · Deploy Infrastructure', ico:'⑤', group:'missions'},
  {id:'m6', label:'M6 · Terraform Workflow', ico:'⑥', group:'missions'},
  {id:'m7', label:'M7 · State Management', ico:'⑦', group:'missions'},
  {id:'m8', label:'M8 · Terraform Destroy', ico:'⑧', group:'missions'},
  {id:'m9', label:'M9 · Resource Manager', ico:'⑨', group:'missions'},
  {id:'m10', label:'M10 · Drift Detection', ico:'⑩', group:'missions'},
  {id:'m11', label:'M11 · Troubleshooting', ico:'⑪', group:'missions'},
  {id:'m12', label:'M12 · Automation Challenge', ico:'⑫', group:'missions'},
  {id:'achievements', label:'Achievements', ico:'🏆', group:'extra'},
  {id:'capstone', label:'Final Capstone', ico:'🎓', group:'extra'},

const MISSIONS = [
  {id:'m1', num:1, title:'Install Terraform', desc:'Download, install, and verify the Terraform binary.', xp:90},
  {id:'m2', num:2, title:'Project Structure', desc:'Create every standard Terraform project file.', xp:90},
  {id:'m3', num:3, title:'Provider Configuration', desc:'Authenticate Terraform against OCI.', xp:100},
  {id:'m4', num:4, title:'Variables', desc:'Define inputs and flow them into resources.', xp:100},
  {id:'m5', num:5, title:'Deploy Infrastructure', desc:'Build a live network architecture with code.', xp:130},
  {id:'m6', num:6, title:'Terraform Workflow', desc:'init → plan → apply, for real.', xp:130},
  {id:'m7', num:7, title:'State Management', desc:'Understand and inspect terraform.tfstate.', xp:100},
  {id:'m8', num:8, title:'Terraform Destroy', desc:'Tear infrastructure down safely, in order.', xp:90},
  {id:'m9', num:9, title:'OCI Resource Manager', desc:'Run Terraform as a managed OCI stack.', xp:110},
  {id:'m10', num:10, title:'Drift Detection', desc:'Catch and repair infrastructure drift.', xp:120},
  {id:'m11', num:11, title:'Infrastructure Troubleshooting', desc:'Diagnose enterprise Terraform failures.', xp:120},
  {id:'m12', num:12, title:'Enterprise Automation Challenge', desc:'Run the full pipeline end to end.', xp:150},
];
const MISSION_ORDER = MISSIONS.map(m=>m.id);

const INSTALL_STEPS = [
  {cmd:'curl -O https://releases.hashicorp.com/terraform/terraform_1.8.0_linux_amd64.zip', out:'######################################## 100.0%', note:'Downloads the Terraform binary archive.'},
  {cmd:'unzip terraform_1.8.0_linux_amd64.zip -d /usr/local/bin', out:'Archive: terraform_1.8.0_linux_amd64.zip\n  inflating: /usr/local/bin/terraform', note:'Installs the single Terraform binary.'},

const IAC_CONCEPTS = [
  {term:'Terraform', def:'An open-source Infrastructure as Code tool that lets you define cloud resources in declarative config files.'},
  {term:'Provider', def:'A plugin that lets Terraform talk to a specific cloud (e.g. the OCI provider) via its API.'},
  {term:'Plugin', def:'The compiled binary behind a provider, downloaded automatically during "terraform init".'},
  {term:'State', def:'A JSON file (terraform.tfstate) that maps your config to real-world resource IDs.'},
  {term:'Module', def:'A reusable, self-contained package of Terraform configuration.'},
];

const PROJECT_FILES = [
  {name:'provider.tf', desc:'Declares and configures the OCI provider (auth, region).'},
  {name:'variables.tf', desc:'Declares input variables with types and descriptions.'},
  {name:'main.tf', desc:'Defines the actual resources to create.'},
  {name:'outputs.tf', desc:'Declares values to display after apply (e.g. a public IP).'},

function isUnlocked(id){
  const idx = MISSION_ORDER.indexOf(id);
  if(idx<=0) return true;
  return STATE.done.has(MISSION_ORDER[idx-1]);
}
function rankFor(xp){
  if(xp>=1400) return 'Cloud Automation Architect';
  if(xp>=900) return 'Senior Infrastructure Engineer';
  if(xp>=500) return 'Infrastructure Engineer';
  if(xp>=150) return 'Associate Engineer';
  return 'Cloud Trainee';
}
function addXP(n, label){
  STATE.xp = Math.max(0, STATE.xp + n);
  document.getElementById('xpDisplay').textContent = STATE.xp;
  document.getElementById('rankChip').textContent = rankFor(STATE.xp);
  toast(n>=0?'xp':'err', (n>=0?'+':'')+n+' XP', label||'');
  checkAchievements();
}
function toast(type, title, msg){
  const wrap = document.getElementById('toast-wrap');
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  const ico = type==='xp' ? '⭐' : type==='ok' ? '✅' : type==='err' ? '⛔' : 'ℹ';
  el.innerHTML = `<div class="t-ico">${ico}</div><div><b>${title}</b><span>${msg||''}</span></div>`;
  wrap.appendChild(el);
  setTimeout(()=>{ el.style.transition='opacity .4s'; el.style.opacity='0'; setTimeout(()=>el.remove(),400); }, 3200);
}
function completeMission(id, xp){
  if(STATE.done.has(id)) return;
  STATE.done.add(id);
  STATE.automationScore = Math.min(100, STATE.automationScore+8);
  STATE.reliability = Math.min(100, STATE.reliability+3);
  STATE.cloudReadiness = Math.min(100, STATE.cloudReadiness+8);
  addXP(xp, MISSIONS.find(m=>m.id===id).title + ' complete');
  toast('ok','Mission Complete', MISSIONS.find(m=>m.id===id).title);
  renderSidebar();
  const idx = MISSION_ORDER.indexOf(id);
  if(idx>=0 && idx<MISSION_ORDER.length-1){
    setTimeout(()=>toast('info','Next mission unlocked', MISSIONS[idx+1].title), 900);
  }
}
function checkAchievements(){
  ACHIEVEMENTS.forEach(a=>{
    if(!STATE.achUnlocked.has(a.id) && a.check(STATE)){
      STATE.achUnlocked.add(a.id);
      setTimeout(()=>toast('ok','Achievement Unlocked 🏆', a.name), 600);
    }
  });
}

/* ================= NAV ================= */
function renderSidebar(){
  const groups = {main:'Overview', missions:'Mission Track', extra:'Beyond the Labs'};
  let html = '';
  Object.keys(groups).forEach(g=>{
    html += `<h4>${groups[g]}</h4>`;
    NAV.filter(n=>n.group===g).forEach(n=>{
      let locked=false, done=false;
      if(MISSION_ORDER.includes(n.id)){ locked=!isUnlocked(n.id); done=STATE.done.has(n.id); }
      html += `<div class="nav-item ${STATE.view===n.id?'active':''} ${locked?'locked':''} ${done?'done':''}"
        onclick="${locked?'':`setView('${n.id}')`}">
        <span class="n-ico">${done?'✓':n.ico}</span>${n.label}
        ${locked?'<span class="nav-badge">🔒</span>':''}
      </div>`;
    });
  });
  const pct = Math.round((STATE.done.size/MISSION_ORDER.length)*100);
  html += `<div class="progress-mini"><div class="lbl"><span>Mission Progress</span><span>${pct}%</span></div>
    <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div></div>`;
  document.getElementById('sidebar').innerHTML = html;
}
function setView(id){
  STATE.view = id;
  const nav = NAV.find(n=>n.id===id);
  document.getElementById('crumbCurrent').textContent = nav ? nav.label : id;
  renderSidebar();
  renderMain();
  const mainEl = document.getElementById('main');
  if(mainEl.scrollIntoView) mainEl.scrollIntoView({behavior:'smooth', block:'start'});
}
function renderMain(){
  const map = {
    home:renderHome, missionmap:renderMissionMap,

    achievements:renderAchievements, capstone:renderCapstone,
  };
  const fn = map[STATE.view] || renderHome;
  document.getElementById('main').innerHTML = `<div class="view active">${fn()}</div>`;
  afterRenderHooks[STATE.view] && afterRenderHooks[STATE.view]();
}

function providerCodePreview(){
  const v = STATE.m3.fields;
  return `<span class="tok-block">provider</span> <span class="tok-str">"oci"</span> {
  tenancy_ocid     = <span class="tok-str">"${v.tenancy_ocid||'...'}"</span>
  user_ocid        = <span class="tok-str">"${v.user_ocid||'...'}"</span>

}`;

function validateM3(){
  PROVIDER_FIELDS.forEach(f=>{ STATE.m3.fields[f.key] = document.getElementById('pf-'+f.key).value.trim(); });
  const missing = PROVIDER_FIELDS.filter(f=>!STATE.m3.fields[f.key]);
  const badFingerprint = STATE.m3.fields.fingerprint && !STATE.m3.fields.fingerprint.includes(':');
  const box = document.getElementById('m3result');
  if(missing.length){
    box.innerHTML = `<div class="mistake-box">⛔ Error: Missing required argument${missing.length>1?'s':''}: ${missing.map(m=>m.key).join(', ')}</div>`;
  } else if(badFingerprint){
    box.innerHTML = `<div class="mistake-box">⛔ Error: 400-InvalidParameter — fingerprint format looks wrong (expected colon-separated hex, e.g. a1:b2:c3:...)</div>`;
  } else {
    box.innerHTML = `<div class="info-box">✓ Provider configuration is valid. Authentication verified against OCI.</div>`;
    STATE.m3.validated = true;
    addXP(15,'Provider validated');
  }
  renderMain();
}

  </div>
  ${STATE.m9.jobStatus==='Succeeded' && !done ? `<div style="margin-top:16px;"><button class="btn btn-primary" onclick="completeMission('m9',110); renderMain();">✓ Complete Mission</button></div>` : ''}
  ${done ? renderQuizBlock('m9') : ''}`;
}
function runRMStep(s){
  if(STATE.m9.stepsDone[s]) return;
  STATE.m9.stepsDone[s] = true;
  toast('ok', s, 'Step complete');
  addXP(8, s);
  if(s==='Execute Job'){
    STATE.m9.jobStatus = 'Accepted';
    STATE.m9.logIndex = 1;
    renderMain();
    let i = 1;
    const iv = setInterval(()=>{
      i++;
      STATE.m9.logIndex = i;
      STATE.m9.jobStatus = i>=RM_JOB_LOG.length ? 'Succeeded' : 'Running';
      renderMain();
      if(i>=RM_JOB_LOG.length){ clearInterval(iv); addXP(20,'Resource Manager job succeeded'); }
    }, 500);
    return;
  }
  renderMain();
}

/* ================= M10: DRIFT DETECTION ================= */
function renderM10(){
  const done = STATE.done.has('m10');
  return `
  <div class="section-head"><div class="eyebrow">Mission 10 · 120 XP</div><h1 class="page-title">Drift Detection</h1>
  <p class="page-sub">An administrator manually deleted the Subnet in the OCI Console. Terraform state doesn't know yet.</p></div>
  <div class="card">
    ${!STATE.m10.driftFound ? `<button class="btn btn-ghost" onclick="detectDrift()">🔍 Detect Drift</button>` : `
    <div class="drift-row mismatch"><span>Subnet (public-subnet-1)</span><span>State: exists · OCI: <b style="color:var(--red);">NOT FOUND</b></span></div>
    <div class="drift-row match"><span>VCN (prod-vcn)</span><span>State: exists · OCI: exists ✓</span></div>
    ${!STATE.m10.driftFixed ? `<div style="margin-top:12px;"><button class="btn btn-primary btn-sm" onclick="fixDrift()">terraform apply (recreate)</button> <button class="btn btn-ghost btn-sm" onclick="fixDrift()">terraform refresh (sync state)</button></div>`
      : `<div class="info-box" style="margin-top:10px;">✓ Drift resolved — state and real infrastructure are back in sync.</div>`}`}
  </div>
  <div class="hr"></div>
  <h4 style="margin-bottom:10px;">Drift Detection Game — repair each scenario (${STATE.m10.gameFixed.size}/${DRIFT_GAME.length})</h4>
  ${DRIFT_GAME.map(d=>{
    const fixed = STATE.m10.gameFixed.has(d.id);
    return `<div class="card" style="margin-bottom:10px; padding:14px;">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <b>${d.label}</b>${fixed?'<span class="pill pill-green">Repaired</span>':'<span class="pill pill-red">Drift detected</span>'}
      </div>
      ${!fixed ? `<button class="btn btn-ghost btn-sm" style="margin-top:8px;" onclick="repairDriftGame('${d.id}')">Investigate &amp; Repair</button>` : `<p class="page-sub" style="margin-top:8px;">${d.explain}</p>`}
    </div>`;
  }).join('')}
  ${STATE.m10.driftFixed && STATE.m10.gameFixed.size>=DRIFT_GAME.length && !done ? `<div style="margin-top:16px;"><button class="btn btn-primary" onclick="completeMission('m10',120); renderMain();">✓ Complete Mission</button></div>` : ''}
  ${done ? renderQuizBlock('m10') : ''}`;
}
function detectDrift(){
  STATE.m10.driftFound = true;
  STATE.driftStatus = 'Drift detected';
  toast('err','Drift found','Subnet exists in state but not in OCI.');
  renderMain();
}
function fixDrift(){
  STATE.m10.driftFixed = true;
  STATE.driftStatus = 'In sync';
  addXP(20,'Drift resolved');
  renderMain();
}
function repairDriftGame(id){
  STATE.m10.gameFixed.add(id);
  addXP(10, DRIFT_GAME.find(d=>d.id===id).label+' repaired');
  renderMain();
}

/* ================= M11: TROUBLESHOOTING + PIPELINE ================= */
function renderM11(){
  const done = STATE.done.has('m11');
  const solvedCount = Object.keys(STATE.m11.solved).length;
  return `
  <div class="section-head"><div class="eyebrow">Mission 11 · 120 XP</div><h1 class="page-title">Infrastructure Troubleshooting</h1>
  <p class="page-sub">Diagnose 12 enterprise Terraform failures, then run the DevOps pipeline end to end. (${solvedCount}/${TF_TROUBLESHOOT.length})</p></div>
  ${TF_TROUBLESHOOT.map(t=>`
    <div class="card" style="margin-bottom:12px;">
      <h5 style="margin-bottom:6px;">${t.title} ${STATE.m11.solved[t.id]?'<span class="pill pill-green">Solved</span>':''}</h5>
      <p class="page-sub" style="margin-bottom:10px;">${t.scenario}</p>
      <div id="tswrap-${t.id}">
        ${t.opts.map((o,i)=>`<div class="q-opt" onclick="answerTS('${t.id}',${i})">${o}</div>`).join('')}
        <div class="q-explain" id="tsex-${t.id}">${t.ex}</div>
      </div>
    </div>`).join('')}
  <div class="hr"></div>
  <h4 style="margin-bottom:10px;">DevOps Pipeline Simulation</h4>
  <div class="pipeline">
    ${PIPELINE_STAGES.map((s,i)=>{
      const cls = i<STATE.pipeline.stage ? 'done' : i===STATE.pipeline.stage ? (STATE.pipeline.failedAt===i?'failed':'active') : '';
      return `${i>0?'<span class="pipe-arrow">→</span>':''}<div class="pipe-stage ${cls}">${s}</div>`;
    }).join('')}
  </div>
  <div style="margin-top:12px;">
    ${STATE.pipeline.failedAt!==null ? `<button class="btn btn-primary btn-sm" onclick="repairPipeline()">🔧 Repair pipeline</button>`
      : STATE.pipeline.stage<PIPELINE_STAGES.length ? `<button class="btn btn-ghost btn-sm" onclick="advancePipeline()">▶ Advance pipeline</button>`
      : `<span class="pill pill-green">Pipeline complete</span>`}
  </div>
  ${solvedCount>=TF_TROUBLESHOOT.length && STATE.pipelineDone && !done ? `<div style="margin-top:16px;"><button class="btn btn-primary" onclick="completeMission('m11',120); renderMain();">✓ Complete Mission</button></div>` : ''}
  ${done ? renderQuizBlock('m11') : ''}`;
}
function answerTS(id, idx){
  const t = TF_TROUBLESHOOT.find(x=>x.id===id);
  const container = document.getElementById('tswrap-'+id);
  const opts = container.querySelectorAll('.q-opt');
  opts.forEach((o,i)=>{ o.onclick=null; if(i===t.a) o.classList.add('correct'); else if(i===idx) o.classList.add('incorrect'); });
  document.getElementById('tsex-'+id).classList.add('show');
  if(idx===t.a){ if(!STATE.m11.solved[id]){ STATE.m11.solved[id]=true; addXP(10, t.title+' resolved'); } }
  else toast('err','Not quite','Check the explanation below.');
  renderSidebar();
}
function advancePipeline(){
  if(STATE.pipeline.stage===2 && !STATE.pipeline.failedOnce){
    STATE.pipeline.failedAt = 2;
    STATE.pipeline.failedOnce = true;
    STATE.pipelineStatus = 'Failed — validation error';
    toast('err','Pipeline failed','Terraform Validate found a syntax error. Repair to continue.');
    renderMain();
    return;
  }
  STATE.pipeline.stage++;
  STATE.pipelineStatus = STATE.pipeline.stage>=PIPELINE_STAGES.length ? 'Succeeded' : PIPELINE_STAGES[STATE.pipeline.stage];
  if(STATE.pipeline.stage>=PIPELINE_STAGES.length){ STATE.pipelineDone = true; addXP(25,'Pipeline completed'); }
  renderMain();
}
function repairPipeline(){
  STATE.pipeline.failedAt = null;
  toast('ok','Pipeline repaired','Resuming from Terraform Validate.');
  renderMain();
}

/* ================= M12: ENTERPRISE AUTOMATION CHALLENGE ================= */
const M12_STEPS = ['Validate','Plan','Apply','Verify','Detect Drift','Repair Drift','Destroy Environment'];
function renderM12(){
  const done = STATE.done.has('m12');
  return `
  <div class="section-head"><div class="eyebrow">Mission 12 · 150 XP</div><h1 class="page-title">Enterprise Automation Challenge</h1>
  <p class="page-sub">Run the complete pipeline end to end: deploy, verify, detect &amp; repair drift, then tear down.</p></div>
  <div class="tag-list" style="margin-bottom:16px;">${M12_STEPS.map(s=>`<span class="pill ${STATE.m12.ranFull?'pill-green':'pill-gray'}">${STATE.m12.ranFull?'✓':'○'} ${s}</span>`).join('')}</div>
  ${!STATE.m12.ranFull ? `<button class="btn btn-primary" onclick="runM12()">🚀 Run Full Pipeline</button>` : `
  <div class="grid grid-4">
    <div class="card"><div class="pill pill-blue">Deployment Time</div><h3 style="margin-top:8px;">11m 42s</h3></div>
    <div class="card"><div class="pill pill-green">Correctness</div><h3 style="margin-top:8px;">100%</h3></div>
    <div class="card"><div class="pill pill-orange">Automation Score</div><h3 style="margin-top:8px;">${STATE.automationScore}</h3></div>
    <div class="card"><div class="pill pill-red">Infrastructure Health</div><h3 style="margin-top:8px;">${STATE.infraHealth}%</h3></div>
  </div>`}
  ${STATE.m12.ranFull && !done ? `<div style="margin-top:16px;"><button class="btn btn-primary" onclick="completeMission('m12',150); renderMain();">✓ Complete Mission</button></div>` : ''}
  ${done ? renderQuizBlock('m12') : ''}`;
}
function runM12(){
  toast('info','Running full pipeline…','Validate → Plan → Apply → Verify → Drift → Repair → Destroy');
  STATE.m12.ranFull = true;
  STATE.devopsMaturity = 100;
  STATE.compliance = 100;
  addXP(30,'Enterprise pipeline executed successfully');
  renderMain();
}

/* ================= ACHIEVEMENTS ================= */
function renderAchievements(){
  return `<div class="section-head"><div class="eyebrow">Achievements</div><h1 class="page-title">Trophy Case</h1>
  <p class="page-sub">${STATE.achUnlocked.size}/${ACHIEVEMENTS.length} unlocked</p></div>
  <div class="grid grid-4">
    ${ACHIEVEMENTS.map(a=>{ const u = STATE.achUnlocked.has(a.id);
      return `<div class="ach-card ${u?'':'locked'}"><div class="ico">${a.ico}</div><h5>${a.name}</h5><p>${u?'Unlocked':a.cond}</p></div>`;
    }).join('')}
  </div>`;
}

/* ================= CAPSTONE ================= */
function renderCapstone(){
  const allDone = MISSION_ORDER.every(m=>STATE.done.has(m));
  const checklist = [
    {label:'Variables fixed (no missing values)', ok:STATE.done.has('m4')},
    {label:'Provider configuration valid', ok:STATE.done.has('m3')},
    {label:'Region &amp; OCIDs correct', ok:STATE.done.has('m3')},
    {label:'Resource dependencies repaired', ok:STATE.done.has('m5')},
    {label:'All required resources present', ok:STATE.done.has('m5')},
    {label:'State file healthy', ok:STATE.done.has('m7')},
    {label:'Infrastructure drift resolved', ok:STATE.done.has('m10')},
    {label:'Resource Manager stack succeeded', ok:STATE.done.has('m9')},
  ];
  return `
  <div class="section-head"><div class="eyebrow">Final Capstone</div><h1 class="page-title">Repair the Broken Terraform Project</h1>
  <p class="page-sub">You've inherited a broken project — missing variables, an invalid provider, wrong OCIDs, broken dependencies, corrupted state, drift, and a failed stack.</p></div>
  <div class="card">${checklist.map(c=>`<div style="display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border-soft);">
    <span class="pill ${c.ok?'pill-green':'pill-gray'}">${c.ok?'✓':'○'}</span><span>${c.label}</span></div>`).join('')}</div>
  ${allDone ? `
  <div class="card" style="text-align:center; margin-top:18px; padding:44px; background:linear-gradient(180deg, rgba(61,220,132,.12), var(--panel));">
    <div style="font-size:44px;margin-bottom:10px;">🎓</div>
    <h2 style="margin-bottom:8px;">Infrastructure Deploys Successfully</h2>
    <p class="page-sub" style="margin-bottom:14px;">Cloud Automation Architect · XP ${STATE.xp}</p>
    <div class="pill pill-green" style="font-size:13px; padding:8px 16px;">Certification Ready</div>
  </div>` : `<div class="tip-box" style="margin-top:16px;">Complete all 12 missions to repair the project and unlock your capstone certificate.</div>`}`;
}

/* ================= QUIZ BLOCK (reused) ================= */
function renderQuizBlock(missionId){
  const qs = QUIZZES[missionId];
  if(!qs) return '';
  const answered = STATE.quizAnswered[missionId] || {};
  return `<div class="card" style="margin-top:20px;"><h4 style="margin-bottom:14px;">🎯 Knowledge Check</h4>
    ${qs.map((q,qi)=>`<div class="quiz-q"><div class="q-txt">${qi+1}. ${q.q}</div>
      ${q.opts.map((o,oi)=>`<div class="q-opt ${answered[qi]===oi?(oi===q.a?'correct':'incorrect'):''}" onclick="answerQuiz('${missionId}',${qi},${oi})">${o}</div>`).join('')}
      <div class="q-explain ${answered[qi]!==undefined?'show':''}">${q.ex}</div></div>`).join('')}
  </div>`;
}
function answerQuiz(missionId, qi, oi){
  if(!STATE.quizAnswered[missionId]) STATE.quizAnswered[missionId] = {};
  if(STATE.quizAnswered[missionId][qi] !== undefined) return;
  STATE.quizAnswered[missionId][qi] = oi;
  const q = QUIZZES[missionId][qi];
  if(oi===q.a){ STATE.quizScores[missionId] = (STATE.quizScores[missionId]||0)+1; addXP(10,'Correct answer'); }
  else toast('err','Not quite','Review the explanation.');
  renderMain();
}

/* ================= INIT ================= */
function toggleTheme(){
  const theme = document.body.getAttribute('data-theme')==='dark' ? 'light' : 'dark';
  document.body.setAttribute('data-theme', theme);
}
document.getElementById('themeToggle').addEventListener('click', toggleTheme);
renderSidebar();
renderMain();
window.STATE = STATE;
Object.assign(window, {QUIZZES, MISSIONS, MISSION_ORDER, INSTALL_STEPS, PROJECT_FILES, PROVIDER_FIELDS,
  VARIABLES_M4, M5_RESOURCES, TF_WORKFLOW_STEPS, DESTROY_ORDER, RM_STEPS, RM_JOB_LOG, DRIFT_GAME,
  TF_TROUBLESHOOT, PIPELINE_STAGES, ACHIEVEMENTS});

</script>
</body>
