function isUnlocked(id){
  const idx = MISSION_ORDER.indexOf(id);
  if(idx<=0) return true;
  return STATE.done.has(MISSION_ORDER[idx-1]);
}
function rankFor(xp){
  if(xp>=1200) return 'Cloud Security Engineer (Ready)';
  if(xp>=800) return 'Senior Security Engineer';
  if(xp>=450) return 'Security Engineer';
  if(xp>=150) return 'Associate Security Engineer';
  return 'Security Trainee';
}
function addXP(n, label){
  STATE.xp = Math.max(0, STATE.xp + n);
  document.getElementById('xpDisplay').textContent = STATE.xp;
  document.getElementById('rankChip').textContent = rankFor(STATE.xp);
  toast(n>=0?'xp':'err', (n>=0?'+':'')+n+' XP', label||'');
  checkAchievements();
}
function toast(type, title, msg){
  const wrap = document.getElementById('toast-wrap');
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  const ico = type==='xp' ? '⭐' : type==='ok' ? '✅' : type==='err' ? '⛔' : 'ℹ';
  el.innerHTML = `<div class="t-ico">${ico}</div><div><b>${title}</b><span>${msg||''}</span></div>`;
  wrap.appendChild(el);
  setTimeout(()=>{ el.style.transition='opacity .4s'; el.style.opacity='0'; setTimeout(()=>el.remove(),400); }, 3200);
}
function completeMission(id, xp){
  if(STATE.done.has(id)) return;
  STATE.done.add(id);
  addXP(xp, MISSIONS.find(m=>m.id===id).title + ' complete');
  toast('ok','Mission Complete', MISSIONS.find(m=>m.id===id).title);
  renderSidebar();
  const idx = MISSION_ORDER.indexOf(id);
  if(idx>=0 && idx<MISSION_ORDER.length-1){
    setTimeout(()=>toast('info','Next mission unlocked', MISSIONS[idx+1].title), 900);
  }
}
function checkAchievements(){
  ACHIEVEMENTS.forEach(a=>{
    if(!STATE.achUnlocked.has(a.id) && a.check(STATE)){
      STATE.achUnlocked.add(a.id);
      setTimeout(()=>toast('ok','Achievement Unlocked 🏆', a.name), 600);
    }
  });
}

/* ================= NAV ================= */
function renderSidebar(){
  const groups = {main:'Overview', missions:'Mission Track', extra:'Beyond the Labs'};
  let html = '';
  Object.keys(groups).forEach(g=>{
    html += `<h4>${groups[g]}</h4>`;
    NAV.filter(n=>n.group===g).forEach(n=>{
      let locked=false, done=false;
      if(MISSION_ORDER.includes(n.id)){ locked=!isUnlocked(n.id); done=STATE.done.has(n.id); }
      html += `<div class="nav-item ${STATE.view===n.id?'active':''} ${locked?'locked':''} ${done?'done':''}"
        onclick="${locked?'':`setView('${n.id}')`}">
        <span class="n-ico">${done?'✓':n.ico}</span>${n.label}
        ${locked?'<span class="nav-badge">🔒</span>':''}
      </div>`;
    });
  });
  const pct = Math.round((STATE.done.size/MISSION_ORDER.length)*100);
  html += `<div class="progress-mini"><div class="lbl"><span>Mission Progress</span><span>${pct}%</span></div>
    <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div></div>`;
  document.getElementById('sidebar').innerHTML = html;
}
function setView(id){
  STATE.view = id;
  const nav = NAV.find(n=>n.id===id);
  document.getElementById('crumbCurrent').textContent = nav ? nav.label : id;
  renderSidebar();
  renderMain();
  const mainEl = document.getElementById('main');
  if(mainEl.scrollIntoView) mainEl.scrollIntoView({behavior:'smooth', block:'start'});
}
function renderMain(){
  const map = {
    home:renderHome, missionmap:renderMissionMap,
    m1:renderM1, m2:renderM2, m3:renderM3, m4:renderM4, m5:renderM5, m6:renderM6,
    m7:renderM7, m8:renderM8, m9:renderM9, m10:renderM10, m11:renderM11, m12:renderM12,
    achievements:renderAchievements, capstone:renderCapstone,
  };
  const fn = map[STATE.view] || renderHome;
  document.getElementById('main').innerHTML = `<div class="view active">${fn()}</div>`;
  afterRenderHooks[STATE.view] && afterRenderHooks[STATE.view]();
}

/* ================= OCI CONSOLE CHROME HELPERS ================= */
function ociFrame(breadcrumbParts, title, actionsHtml, bodyHtml){
  return `<div class="oci-console">
    <div class="oci-topbar">
      <span class="oci-hamburger">☰</span>
      <span class="oci-logo"><span class="dot"></span>Oracle Cloud</span>
      <span class="oci-search">🔍 Search resources, services, and documentation</span>
      <span class="oci-region">🌐 US East (Ashburn)</span>
      <span class="oci-user">AB</span>
    </div>
    <div class="oci-breadcrumb">${breadcrumbParts.map((p,i)=>`${i>0?'<span class="sep">/</span>':''}${i===breadcrumbParts.length-1?`<b>${p}</b>`:p}`).join('')}</div>
    <div class="oci-body">
      <div class="oci-page-title">${title}</div>
      ${actionsHtml?`<div class="oci-actions">${actionsHtml}</div>`:''}
      ${bodyHtml}
    </div>
  </div>`;
}
function ociStatus(state){
  const map = {ACTIVE:'active', AVAILABLE:'available', ENABLED:'active', CREATING:'provisioning', PROVISIONING:'provisioning', DISABLED:'terminated'};
  const cls = map[state] || 'provisioning';
  return `<span class="oci-status ${cls}"><span class="dot"></span>${state}</span>`;
}
function ociTable(headers, rows){
  if(!rows.length) return `<div class="oci-empty">No resources found in this compartment yet. Click the button above to create one.</div>`;
  return `<table class="oci-table"><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>
    ${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}
  </tbody></table>`;
}
function archDiagram(steps, activeCount){
  return `<div class="arch-diagram">${steps.map((s,i)=>`${i>0?'<div class="arch-arrow">↓</div>':''}<div class="arch-node ${i<activeCount?'active':'pending'}">${s}</div>`).join('')}</div>`;
}

/* ================= MISSION MAP ================= */
function renderMissionMap(){
  let nodes = MISSIONS.map(m=>{
    const locked = !isUnlocked(m.id); const done = STATE.done.has(m.id); const current = !locked && !done;
    return `<div class="m-node ${locked?'locked':''} ${done?'done':''} ${current?'current':''}" onclick="${locked?'':`setView('${m.id}')`}">
      <div class="m-num">${done?'✓':m.num}</div><h4>${m.title}</h4><p>${m.desc}</p>
      <div class="m-xp">⭐ ${m.xp} XP</div>${locked?'<div class="pill pill-gray" style="margin-top:6px;">🔒</div>':''}
    </div>`;
  }).join('');
  return `<div class="section-head"><div class="eyebrow">Mission Map</div><h1 class="page-title">Secure ABC Bank's Production Environment</h1>
  <p class="page-sub">Complete missions in order — each unlocks the next.</p></div>
  <div class="mission-map"><div class="mission-track">${nodes}</div></div>`;
}

  return `
  <div class="section-head"><div class="eyebrow">Mission 10 · 100 XP</div><h1 class="page-title">OCI CLI — Vault &amp; KMS</h1>
  <p class="page-sub">Manage secrets and keys from the command line.</p></div>
  <div class="terminal" id="m10term">
    ${STATE.m10.history.map(h=>`<div class="line"><span class="prompt">$</span> ${h.cmd}</div><div class="line out">${h.out.replace(/\n/g,'<br>')}</div><div class="line comment"># ${h.note}</div>`).join('')}
    ${step<CLI_STEPS_M10.length ? `<div class="line"><span class="prompt">$</span> <span style="color:var(--text-faint);">${CLI_STEPS_M10[step].cmd}</span></div>` : ''}
  </div>
  <div style="margin-top:14px;">${step<CLI_STEPS_M10.length ? `<button class="btn btn-primary" onclick="runM10Step()">▶ Run next command</button>` : `<span class="pill pill-green">All commands executed</span>`}</div>
  ${step>=CLI_STEPS_M10.length && !done ? `<div style="margin-top:16px;"><button class="btn btn-primary" onclick="completeMission('m10',100); renderMain();">✓ Complete Mission</button></div>` : ''}
  ${done ? renderQuizBlock('m10') : ''}`;
}
function runM10Step(){
  const s = CLI_STEPS_M10[STATE.m10.step];
  STATE.m10.history.push(s);
  STATE.m10.step++;
  addXP(10, s.cmd.split(' ').slice(0,3).join(' '));
  renderMain();
}

/* ================= M11: SDK INTEGRATION ================= */
function renderM11(){
  const done = STATE.done.has('m11');
  const execCount = Object.keys(STATE.m11.executed).length;
  return `
  <div class="section-head"><div class="eyebrow">Mission 11 · 100 XP</div><h1 class="page-title">SDK Integration</h1>
  <p class="page-sub">Call Vault APIs from real application code.</p></div>
  <div class="chip-row">${Object.keys(SDK_LANGS).map(l=>`<button class="chip ${STATE.m11.lang===l?'active':''}" onclick="setSdkLang('${l}')">${l}</button>`).join('')}</div>
  <div class="code-block">${SDK_LANGS[STATE.m11.lang]}</div>
  <div class="chip-row" style="margin-top:14px;">${SDK_ACTIONS.map(a=>`<button class="btn btn-ghost btn-sm" onclick="execSdk('${a}')">Execute: ${a}</button>`).join('')}</div>
  <div id="sdkResult"></div>
  ${execCount>=SDK_ACTIONS.length && !done ? `<div style="margin-top:16px;"><button class="btn btn-primary" onclick="completeMission('m11',100); renderMain();">✓ Complete Mission</button></div>` : ''}
  ${done ? renderQuizBlock('m11') : ''}`;
}
function setSdkLang(l){ STATE.m11.lang = l; renderMain(); }
function execSdk(action){
  STATE.m11.executed[action] = true;
  document.getElementById('sdkResult').innerHTML = `<div class="code-block" style="margin-top:10px;">${SDK_RESPONSES[action]}</div>`;
  addXP(10, action);
  renderSidebar();
}

/* ================= M12: ENTERPRISE INCIDENT RESPONSE ================= */
function renderM12(){
  const done = STATE.done.has('m12');
  const complianceOk = COMPLIANCE_CHECKS.filter(c=>c.ok(STATE)).length;
  const attacksCount = Object.keys(STATE.m12.attacksTried).length;
  return `
  <div class="section-head"><div class="eyebrow">Mission 12 · 150 XP</div><h1 class="page-title">Enterprise Incident Response</h1>
  <p class="page-sub">Resolved: ${STATE.m12.resolved.size}/${INCIDENTS_12.length}. The auditor arrives soon.</p></div>
  ${INCIDENTS_12.map(inc=>{
    const resolved = STATE.m12.resolved.has(inc.id);
    return `<div class="incident-card ${resolved?'resolved':''}">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <h4>🚨 ${inc.title}</h4>${resolved?'<span class="pill pill-green">Resolved</span>':'<span class="pill pill-red">Active</span>'}
      </div>
      <p class="page-sub" style="margin:8px 0 10px;">${inc.symptoms}</p>
      ${!resolved ? `<div id="inc12-${inc.id}">${inc.opts.map((o,i)=>`<div class="q-opt" onclick="answerIncident12('${inc.id}',${i})">${o}</div>`).join('')}</div>` : ''}
    </div>`;
  }).join('')}
  <div class="hr"></div>
  <h4 style="margin-bottom:10px;">🕵 Compliance Game (${complianceOk}/${COMPLIANCE_CHECKS.length})</h4>
  <div class="card" style="margin-bottom:16px;">
    ${COMPLIANCE_CHECKS.map(c=>`<div class="finding-row"><span>${c.label}</span><span style="margin-left:auto;"><span class="pill ${c.ok(STATE)?'pill-green':'pill-red'}">${c.ok(STATE)?'✓ Pass':'✗ Fail'}</span></span></div>`).join('')}
  </div>
  <h4 style="margin-bottom:10px;">🥷 Attack Simulation (${attacksCount}/${ATTACK_ATTEMPTS.length})</h4>
  <div class="card">
    ${ATTACK_ATTEMPTS.map(a=>`<div class="finding-row"><span>${a.label}</span><span style="margin-left:auto;">${STATE.m12.attacksTried[a.id]?'<span class="sev-badge denied">access denied</span>':`<button class="btn btn-ghost btn-sm" onclick="tryAttack('${a.id}')">Attempt</button>`}</span></div>${STATE.m12.attacksTried[a.id]?`<p class="page-sub" style="margin:-2px 0 8px 4px;">${a.reason}</p>`:''}`).join('')}
  </div>
  ${STATE.m12.resolved.size>=INCIDENTS_12.length && !done ? `<div style="margin-top:16px;"><button class="btn btn-primary" onclick="completeMission('m12',150); renderMain();">✓ Complete Mission</button></div>` : ''}
  ${done ? renderQuizBlock('m12') : ''}`;
}
function answerIncident12(id, idx){
  const inc = INCIDENTS_12.find(x=>x.id===id);
  const container = document.getElementById('inc12-'+id);
  const opts = container.querySelectorAll('.q-opt');
  opts.forEach((o,i)=>{ o.onclick=null; if(i===inc.a) o.classList.add('correct'); else if(i===idx) o.classList.add('incorrect'); });
  if(idx===inc.a){
    STATE.m12.resolved.add(id);
    addXP(15, inc.title+' resolved');
    toast('ok','Incident resolved', inc.title);
  } else {
    addXP(-5, 'Incorrect response to '+inc.title);
  }
  renderSidebar();
  setTimeout(renderMain, 400);
}
function tryAttack(id){
  if(STATE.m12.attacksTried[id]) return;
  STATE.m12.attacksTried[id] = true;
  addXP(6,'Attack blocked and logged');
  renderMain();
}

/* ================= ACHIEVEMENTS ================= */
function renderAchievements(){
  return `<div class="section-head"><div class="eyebrow">Achievements</div><h1 class="page-title">Trophy Case</h1>
  <p class="page-sub">${STATE.achUnlocked.size}/${ACHIEVEMENTS.length} unlocked</p></div>
  <div class="grid grid-4">
    ${ACHIEVEMENTS.map(a=>{ const u = STATE.achUnlocked.has(a.id);
      return `<div class="ach-card ${u?'':'locked'}"><div class="ico">${a.ico}</div><h5>${a.name}</h5><p>${u?'Unlocked':a.cond}</p></div>`;
    }).join('')}
  </div>`;
}

/* ================= CAPSTONE ================= */
function renderCapstone(){
  const allDone = MISSION_ORDER.every(m=>STATE.done.has(m));
  const checklist = [
    {label:'Vault created and Active', ok:STATE.m1.active},
    {label:'Customer Managed Key created', ok:STATE.m2.created},
    {label:'Secret created with a version history', ok:STATE.m8.newVersionCreated},
    {label:'Key rotated at least once', ok:STATE.m6.rotations>=1},
    {label:'Block Volume encrypted with CMK', ok:STATE.m4.switched},
    {label:'Encryption verified', ok:STATE.m5.verified},
    {label:'OCI CLI working end to end', ok:STATE.done.has('m10')},
    {label:'IAM policies &amp; application access repaired', ok:STATE.done.has('m11')},
    {label:'All incidents resolved', ok:STATE.done.has('m12')},
  ];
  return `
  <div class="section-head"><div class="eyebrow">Final Capstone</div><h1 class="page-title">Pass the Audit</h1>
  <p class="page-sub">You inherited an insecure production environment. Repair everything before the auditors arrive.</p></div>
  <div class="card">${checklist.map(c=>`<div style="display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border-soft);">
    <span class="pill ${c.ok?'pill-green':'pill-gray'}">${c.ok?'✓':'○'}</span><span>${c.label}</span></div>`).join('')}</div>
  ${allDone ? `
  <div class="card" style="text-align:center; margin-top:18px; padding:44px; background:linear-gradient(180deg, rgba(61,220,132,.12), var(--panel));">
    <div style="font-size:44px;margin-bottom:10px;">🎓</div>
    <h2 style="margin-bottom:8px;">Production Environment Secured</h2>
    <p class="page-sub" style="margin-bottom:14px;">Cloud Security Engineer · XP ${STATE.xp}</p>
    <div class="pill pill-green" style="font-size:13px; padding:8px 16px;">Certification Ready</div>
  </div>` : `<div class="tip-box" style="margin-top:16px;">Complete all 12 missions to pass the audit.</div>`}`;
}

/* ================= QUIZ BLOCK (reused) ================= */
function renderQuizBlock(missionId){
  const qs = QUIZZES[missionId];
  if(!qs) return '';
  const answered = STATE.quizAnswered[missionId] || {};
  return `<div class="card" style="margin-top:20px;"><h4 style="margin-bottom:14px;">🎯 Knowledge Check</h4>
    ${qs.map((q,qi)=>`<div class="quiz-q"><div class="q-txt">${qi+1}. ${q.q}</div>
      ${q.opts.map((o,oi)=>`<div class="q-opt ${answered[qi]===oi?(oi===q.a?'correct':'incorrect'):''}" onclick="answerQuiz('${missionId}',${qi},${oi})">${o}</div>`).join('')}
      <div class="q-explain ${answered[qi]!==undefined?'show':''}">${q.ex}</div></div>`).join('')}
  </div>`;
}
function answerQuiz(missionId, qi, oi){
  if(!STATE.quizAnswered[missionId]) STATE.quizAnswered[missionId] = {};
  if(STATE.quizAnswered[missionId][qi] !== undefined) return;
  STATE.quizAnswered[missionId][qi] = oi;
  const q = QUIZZES[missionId][qi];
  if(oi===q.a){ STATE.quizScores[missionId] = (STATE.quizScores[missionId]||0)+1; addXP(10,'Correct answer'); }
  else toast('err','Not quite','Review the explanation.');
  renderMain();
}

/* ================= INIT ================= */
function toggleTheme(){
  const theme = document.body.getAttribute('data-theme')==='dark' ? 'light' : 'dark';
  document.body.setAttribute('data-theme', theme);
}
document.getElementById('themeToggle').addEventListener('click', toggleTheme);
renderSidebar();
renderMain();
window.STATE = STATE;
Object.assign(window, {QUIZZES, MISSIONS, MISSION_ORDER, SECRET_TYPES, CLI_STEPS_M10, SDK_ACTIONS,
  INCIDENTS_12, COMPLIANCE_CHECKS, ATTACK_ATTEMPTS, ACHIEVEMENTS});

</script>
</body>
</html>
