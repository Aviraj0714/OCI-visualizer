<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Day 2 Lab — Security &amp; Governance | 1Z0-1067-26</title>
<style>
:root{
  --bg:#0d1117; --bg2:#11161d; --panel:#151b23; --panel2:#1a212b;
  --border:#232b36; --border-soft:#1d2530;
  --text:#e6ebf1; --text-dim:#9aa7b6; --text-faint:#5f6b7a;
  --red:#ff3b30; --red-dim:#c62b22; --red-glow:rgba(255,59,48,.25);
  --blue:#4da3ff; --blue-dim:#2f6fd1;
  --orange:#ffab40; --green:#3ddc84; --green-dim:#279a5c;
  --yellow:#ffd54a; --purple:#b48bff;
  --radius:14px; --radius-sm:9px;
  --shadow: 0 8px 30px rgba(0,0,0,.35);
  --mono: 'SFMono-Regular', Consolas, 'Courier New', monospace;
  --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif;
}
[data-theme="light"]{
  --bg:#f4f5f7; --bg2:#eceef1; --panel:#ffffff; --panel2:#f7f8fa;
  --border:#e1e4e9; --border-soft:#ebedf0;
  --text:#1b2129; --text-dim:#5b6572; --text-faint:#8b95a3;
  --red:#e0342a; --red-dim:#c62b22; --red-glow:rgba(224,52,42,.18);
  --shadow: 0 8px 30px rgba(20,20,30,.08);
}
*{box-sizing:border-box; margin:0; padding:0;}
html{scroll-behavior:smooth;}
body{background:var(--bg); color:var(--text); font-family:var(--sans); min-height:100vh; overflow-x:hidden; transition:background .3s,color .3s;}
body::before{content:''; position:fixed; inset:0; pointer-events:none; z-index:0;
  background: radial-gradient(circle at 15% 10%, var(--red-glow), transparent 40%), radial-gradient(circle at 85% 90%, rgba(77,163,255,.10), transparent 45%);}
::-webkit-scrollbar{width:10px; height:10px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border); border-radius:10px;}
a{color:inherit;} button{font-family:inherit; cursor:pointer;}

.topbar{position:sticky; top:0; z-index:100; display:flex; align-items:center; gap:14px; padding:10px 18px;
  background:color-mix(in srgb, var(--panel) 88%, transparent); backdrop-filter:blur(14px); border-bottom:1px solid var(--border-soft);}
.brand{display:flex; align-items:center; gap:10px; font-weight:700;}
.brand .logo{width:30px; height:30px; border-radius:8px; background:linear-gradient(135deg, var(--red), var(--red-dim));
  display:flex; align-items:center; justify-content:center; font-size:13px; color:#fff; font-weight:800; box-shadow:0 4px 14px var(--red-glow);}
.brand small{display:block; font-weight:500; color:var(--text-faint); font-size:10.5px; letter-spacing:.5px;}
.crumb{display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--text-dim); flex:1; min-width:0; overflow:hidden; white-space:nowrap;}
.crumb b{color:var(--text); font-weight:600;}
.topbar-right{display:flex; align-items:center; gap:10px;}
.xp-chip{display:flex; align-items:center; gap:7px; background:var(--panel2); border:1px solid var(--border); padding:6px 12px; border-radius:20px; font-size:12.5px; font-weight:600;}
.xp-chip .dot{width:7px; height:7px; border-radius:50%; background:var(--orange); box-shadow:0 0 8px var(--orange);}
.rank-chip{background:linear-gradient(135deg, var(--red), var(--red-dim)); color:#fff; font-size:11.5px; font-weight:700; padding:6px 11px; border-radius:20px;}
.icon-btn{width:34px; height:34px; border-radius:9px; border:1px solid var(--border); background:var(--panel2); color:var(--text-dim); display:flex; align-items:center; justify-content:center; font-size:15px; transition:.15s;}
.icon-btn:hover{color:var(--text); border-color:var(--text-faint);}

.app{display:flex; min-height:calc(100vh - 54px); position:relative; z-index:1;}
.sidebar{width:255px; flex-shrink:0; border-right:1px solid var(--border-soft); padding:16px 10px; position:sticky; top:54px; height:calc(100vh - 54px); overflow-y:auto; background:color-mix(in srgb, var(--bg2) 60%, transparent);}
.sidebar h4{font-size:10.5px; text-transform:uppercase; letter-spacing:1px; color:var(--text-faint); padding:14px 10px 6px;}
.nav-item{display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:9px; font-size:12.5px; color:var(--text-dim); cursor:pointer; transition:.15s; margin-bottom:2px; border:1px solid transparent;}
.nav-item .n-ico{width:22px; text-align:center; font-size:12.5px; flex-shrink:0;}
.nav-item:hover{background:var(--panel2); color:var(--text);}
.nav-item.active{background:var(--red-glow); color:var(--text); border-color:var(--red-dim); font-weight:600;}
.nav-item.locked{opacity:.4; cursor:not-allowed;}
.nav-item.done .n-ico{color:var(--green);}
.nav-badge{margin-left:auto; font-size:10px; background:var(--panel); border:1px solid var(--border); padding:1px 6px; border-radius:8px; color:var(--text-faint);}
.nav-item.done .nav-badge{color:var(--green); border-color:var(--green-dim);}
.progress-mini{margin:10px 8px 4px; padding:10px; background:var(--panel); border:1px solid var(--border); border-radius:10px;}
.progress-mini .lbl{display:flex; justify-content:space-between; font-size:11px; color:var(--text-dim); margin-bottom:6px;}
.bar-track{height:6px; border-radius:5px; background:var(--border-soft); overflow:hidden;}
.bar-fill{height:100%; background:linear-gradient(90deg, var(--red), var(--orange)); border-radius:5px; transition:width .5s ease;}

.main{flex:1; min-width:0; padding:26px 30px 80px;}
.view{display:none; animation:fadeIn .35s ease;}
.view.active{display:block;}
@keyframes fadeIn{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);}}
.section-head{margin-bottom:22px;}
.eyebrow{font-size:11px; text-transform:uppercase; letter-spacing:1.5px; color:var(--red); font-weight:700; margin-bottom:6px;}
h1.page-title{font-size:25px; font-weight:800; letter-spacing:-.3px;}
.page-sub{color:var(--text-dim); font-size:13.5px; margin-top:5px; max-width:700px;}
.card{background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); padding:20px; box-shadow:var(--shadow);}
.grid{display:grid; gap:16px;}
.grid-2{grid-template-columns:1fr 1fr;} .grid-3{grid-template-columns:repeat(3,1fr);} .grid-4{grid-template-columns:repeat(4,1fr);} .grid-6{grid-template-columns:repeat(6,1fr);}
@media(max-width:1000px){.grid-2,.grid-3,.grid-4,.grid-6{grid-template-columns:1fr 1fr;}}
@media(max-width:650px){.grid-2,.grid-3,.grid-4,.grid-6{grid-template-columns:1fr;}}
.btn{display:inline-flex; align-items:center; gap:8px; padding:11px 20px; border-radius:10px; border:none; font-weight:700; font-size:13.5px; transition:.15s;}
.btn-primary{background:linear-gradient(135deg,var(--red),var(--red-dim)); color:#fff; box-shadow:0 6px 20px var(--red-glow);}
.btn-primary:hover{transform:translateY(-1px); box-shadow:0 10px 26px var(--red-glow);}
.btn-ghost{background:var(--panel2); color:var(--text); border:1px solid var(--border);}
.btn-ghost:hover{border-color:var(--text-faint);}
.btn-sm{padding:7px 13px; font-size:12px; border-radius:8px;}
.btn:disabled{opacity:.4; cursor:not-allowed; transform:none !important;}
.pill{display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:700; padding:3px 9px; border-radius:20px;}
.pill-green{background:rgba(61,220,132,.14); color:var(--green);}
.pill-red{background:rgba(255,59,48,.14); color:var(--red);}
.pill-orange{background:rgba(255,171,64,.14); color:var(--orange);}
.pill-blue{background:rgba(77,163,255,.14); color:var(--blue);}
.pill-purple{background:rgba(180,139,255,.14); color:var(--purple);}
.pill-gray{background:var(--panel2); color:var(--text-faint); border:1px solid var(--border);}
#toast-wrap{position:fixed; bottom:22px; right:22px; z-index:9999; display:flex; flex-direction:column; gap:10px;}
.toast{background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:13px 16px; box-shadow:var(--shadow); display:flex; align-items:center; gap:10px; min-width:260px; animation:toastIn .3s ease; font-size:13px;}
@keyframes toastIn{from{opacity:0; transform:translateX(30px);} to{opacity:1; transform:translateX(0);}}
.toast .t-ico{font-size:18px;} .toast b{display:block; font-size:12.5px;} .toast span{color:var(--text-dim); font-size:11.5px;}
.toast.xp b{color:var(--orange);} .toast.ok .t-ico{color:var(--green);} .toast.err .t-ico{color:var(--red);}

.mission-map{position:relative; padding:20px 10px;}
.mission-track{display:flex; flex-wrap:wrap; gap:18px;}
.m-node{width:205px; background:var(--panel); border:1px solid var(--border); border-radius:16px; padding:16px; position:relative; transition:.2s; cursor:pointer;}
.m-node:hover{transform:translateY(-3px); border-color:var(--text-faint);}
.m-node.locked{opacity:.45; cursor:not-allowed; filter:grayscale(.6);}
.m-node.locked:hover{transform:none;}
.m-node.done{border-color:var(--green-dim); background:linear-gradient(180deg, rgba(61,220,132,.06), var(--panel));}
.m-node.current{border-color:var(--red-dim); box-shadow:0 0 0 3px var(--red-glow);}
.m-num{width:32px; height:32px; border-radius:10px; background:var(--panel2); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:12px; margin-bottom:8px;}
.m-node.done .m-num{background:var(--green); color:#052e17; border-color:var(--green);}
.m-node.current .m-num{background:var(--red); color:#fff; border-color:var(--red);}
.m-node h4{font-size:13.5px; margin-bottom:4px;}
.m-node p{font-size:11px; color:var(--text-dim); line-height:1.5; margin-bottom:8px;}
.m-node .m-xp{font-size:10.5px; color:var(--orange); font-weight:700;}

.field{margin-bottom:14px;}
.field label{display:block; font-size:12px; color:var(--text-dim); margin-bottom:6px; font-weight:600;}
.field input, .field select, .field textarea{width:100%; padding:10px 12px; border-radius:9px; border:1px solid var(--border); background:var(--panel2); color:var(--text); font-size:13px; font-family:inherit;}
.field input:focus, .field select:focus, .field textarea:focus{outline:none; border-color:var(--red-dim);}

.hr{height:1px; background:var(--border-soft); margin:20px 0;}
.two-col{display:grid; grid-template-columns:1fr 1fr; gap:18px;}
@media(max-width:900px){.two-col{grid-template-columns:1fr;} .sidebar{display:none;}}
.tag-list{display:flex; flex-wrap:wrap; gap:8px;}
.info-box{padding:12px 14px; border-radius:10px; border-left:3px solid var(--blue-dim); background:rgba(77,163,255,.06); font-size:12.5px; margin:12px 0;}
.tip-box{padding:12px 14px; border-radius:10px; border-left:3px solid var(--orange); background:rgba(255,171,64,.07); font-size:12.5px; margin:12px 0;}
.mistake-box{padding:12px 14px; border-radius:10px; border-left:3px solid var(--red); background:rgba(255,59,48,.06); font-size:12.5px; margin:12px 0;}
.hidden{display:none !important;}
.chip-row{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px;}
.chip{padding:8px 13px; background:var(--panel2); border:1px solid var(--border); border-radius:8px; font-size:12px; font-weight:600; cursor:pointer; transition:.15s;}
.chip:hover{border-color:var(--text-faint);}
.chip.active{background:var(--red-glow); border-color:var(--red-dim);}

.quiz-q{margin-bottom:20px; padding-bottom:16px; border-bottom:1px solid var(--border-soft);}
.quiz-q:last-child{border:none;}
.quiz-q .q-txt{font-weight:700; font-size:14px; margin-bottom:12px;}
.q-opt{display:flex; align-items:center; gap:10px; padding:11px 14px; border:1px solid var(--border); border-radius:10px; margin-bottom:8px; cursor:pointer; transition:.15s; font-size:13px;}
.q-opt:hover{border-color:var(--text-faint);}
.q-opt.correct{border-color:var(--green-dim); background:rgba(61,220,132,.1);}
.q-opt.incorrect{border-color:var(--red-dim); background:rgba(255,59,48,.1);}
.q-explain{margin-top:8px; padding:10px 12px; background:var(--panel2); border-radius:9px; font-size:12px; color:var(--text-dim); display:none; border-left:3px solid var(--blue-dim);}
.q-explain.show{display:block;}

.ach-card{text-align:center; padding:20px 12px; border-radius:14px; border:1px solid var(--border); background:var(--panel); transition:.2s;}
.ach-card.locked{opacity:.35; filter:grayscale(1);}
.ach-card .ico{font-size:32px; margin-bottom:8px;}
.ach-card h5{font-size:12.5px; margin-bottom:4px;}
.ach-card p{font-size:10.5px; color:var(--text-dim);}

.health-meter{margin-bottom:12px;}
.health-meter .hm-lbl{display:flex; justify-content:space-between; font-size:11.5px; color:var(--text-dim); margin-bottom:5px;}
.hm-track{height:8px; border-radius:6px; background:var(--border-soft); overflow:hidden;}
.hm-fill{height:100%; border-radius:6px; transition:width .5s ease;}

.threat-card{border:1px solid var(--border); border-radius:12px; padding:14px; background:var(--panel2); margin-bottom:10px;}
.threat-card.high{border-color:var(--red-dim);}
.threat-card.medium{border-color:var(--orange);}
.threat-card.low{border-color:var(--blue-dim);}

.hier-tree{display:flex; flex-direction:column; gap:8px; padding-left:0;}
.hier-node{padding:10px 14px; border-radius:9px; border:1px solid var(--border); background:var(--panel2); cursor:pointer; transition:.15s; font-size:13px; font-weight:600;}
.hier-node.child{margin-left:26px;}
.hier-node.selected{border-color:var(--red-dim); background:var(--red-glow);}
.hier-node.covered{border-color:var(--green-dim);}
.hier-node.exposed{border-color:var(--red-dim); background:rgba(255,59,48,.08);}

.detector-row{display:flex; align-items:center; gap:12px; padding:12px 14px; border:1px solid var(--border); border-radius:10px; margin-bottom:8px; background:var(--panel2);}
.toggle{width:40px; height:22px; border-radius:20px; background:var(--border); position:relative; cursor:pointer; flex-shrink:0; transition:.2s;}
.toggle.on{background:var(--green-dim);}
.toggle .knob{width:18px; height:18px; border-radius:50%; background:#fff; position:absolute; top:2px; left:2px; transition:.2s;}
.toggle.on .knob{left:20px;}

.finding-row{display:flex; align-items:center; gap:10px; padding:10px 12px; border:1px solid var(--border); border-radius:9px; margin-bottom:6px; background:var(--panel2); font-size:12.5px;}
.sev-badge{font-size:10px; font-weight:800; padding:2px 8px; border-radius:6px; text-transform:uppercase;}
.sev-badge.critical{background:rgba(255,59,48,.2); color:var(--red);}
.sev-badge.high{background:rgba(255,59,48,.14); color:var(--red);}
.sev-badge.medium{background:rgba(255,171,64,.18); color:var(--orange);}
.sev-badge.low{background:rgba(77,163,255,.18); color:var(--blue);}

.gauge-wrap{text-align:center;}
.gauge-track{height:8px; border-radius:6px; background:var(--border-soft); overflow:hidden; margin:8px 0;}
.gauge-fill{height:100%; border-radius:6px; transition:width .6s ease;}

.slider-wrap{margin:16px 0;}
.slider-wrap input[type=range]{width:100%;}

.state-json{background:#0a0d12; border:1px solid #232b36; border-radius:10px; padding:14px; font-family:var(--mono); font-size:11.5px; color:#c9d2dc; max-height:320px; overflow:auto; white-space:pre;}
</style>
</head>

<div id="toast-wrap"></div>

  <div class="brand"><div class="logo">C</div><div>Day 2 Lab <small>1Z0-1067-26 · Security &amp; Governance</small></div></div>

</div>

  <div class="sidebar" id="sidebar"></div>
  <div class="main" id="main"></div>
</div>
<script>
/* ================= DATA ================= */
const NAV = [
  {id:'home', label:'SOC Dashboard', ico:'⌂', group:'main'},
  {id:'missionmap', label:'Mission Map', ico:'🗺', group:'main'},
  {id:'m1', label:'M1 · Enable Cloud Guard', ico:'①', group:'missions'},
  {id:'m2', label:'M2 · Cloud Guard Target', ico:'②', group:'missions'},
  {id:'m3', label:'M3 · Detector Recipes', ico:'③', group:'missions'},
  {id:'m4', label:'M4 · Responder Recipes', ico:'④', group:'missions'},
  {id:'m5', label:'M5 · Security Zones', ico:'⑤', group:'missions'},
  {id:'m6', label:'M6 · Budgets', ico:'⑥', group:'missions'},
  {id:'m7', label:'M7 · Cost Analysis', ico:'⑦', group:'missions'},
  {id:'troubleshoot', label:'Troubleshooting', ico:'🧩', group:'extra'},
  {id:'exam', label:'Exam Challenges', ico:'📝', group:'extra'},
  {id:'achievements', label:'Achievements', ico:'🏆', group:'extra'},
  {id:'capstone', label:'Capstone Lab', ico:'🎓', group:'extra'},
];

const MISSIONS = [
  {id:'m1', num:1, title:'Enable Cloud Guard', desc:'Turn on tenancy-wide threat detection.', xp:100},
  {id:'m2', num:2, title:'Create Cloud Guard Target', desc:'Choose what Cloud Guard actually watches.', xp:90},
  {id:'m3', num:3, title:'Configure Detector Recipes', desc:'Tune the rules that spot risky resources.', xp:110},
  {id:'m4', num:4, title:'Configure Responder Recipes', desc:'Automate remediation for common threats.', xp:120},
  {id:'m5', num:5, title:'Deploy Security Zone', desc:'Make insecure deployments impossible.', xp:120},
  {id:'m6', num:6, title:'Create Budgets', desc:'Set spending limits and alert thresholds.', xp:90},
  {id:'m7', num:7, title:'Analyze Costs', desc:'Find and eliminate wasted cloud spend.', xp:110},
];
const MISSION_ORDER = MISSIONS.map(m=>m.id);

const INSECURE_FINDINGS = [
  {label:'Open Security List (0.0.0.0/0 : 22)', sev:'critical'},
  {label:'Public Object Storage Bucket "app-backups"', sev:'high'},
  {label:'No tenancy-wide threat monitoring', sev:'high'},
  {label:'IAM user with no MFA and unused API key', sev:'medium'},
];
const CLOUD_GUARD_CONCEPTS = [
  {term:'Cloud Guard', def:'OCI\'s native security posture and threat detection service — continuously monitors resources for misconfigurations and suspicious activity.'},
  {term:'Detector Recipe', def:'A set of rules Cloud Guard uses to identify risky configurations (e.g. a public bucket).'},
  {term:'Responder Recipe', def:'A set of automated or manual actions Cloud Guard can take when a problem is detected.'},
  {term:'Target', def:'The compartment (or root tenancy) that a Detector/Responder Recipe pair actually applies to.'},
];
const ATTACK_ALERTS = [
  {sev:'high', title:'Port scan detected from 203.0.113.9', desc:'An external IP swept common ports (22, 3389, 3306) against a public subnet.'},
  {sev:'medium', title:'Unusual API call volume', desc:'A service account made 40x its normal number of ListBucket calls in 5 minutes.'},
  {sev:'low', title:'New IAM user created outside business hours', desc:'A user account was created at 2:14 AM local time — worth a review, not necessarily malicious.'},
];

const HIERARCHY = [
  {id:'root', label:'Root Tenancy', level:0},
  {id:'dev', label:'Development', level:1},
  {id:'test', label:'Testing', level:1},
  {id:'prod', label:'Production', level:1},
];

const DETECTORS = [
  {id:'pubstorage', label:'Public Object Storage', risk:'A bucket readable by anyone on the internet can leak sensitive data.', severity:'High',
    example:'A misconfigured backups bucket exposed customer invoices for 11 days before detection.',
    examtip:'Cloud Guard\'s Object Storage detector flags "Public Access Enabled" — know this is the primary control at exam time.',
    mistake:'Teams often set a bucket public "temporarily" for a demo and forget to revert it.'},
  {id:'pubcompute', label:'Public Compute', risk:'Instances with a public IP and permissive security rules are directly reachable by attackers.', severity:'High',
    example:'A dev VM left with a public IP and open RDP port was compromised and used for crypto-mining.',
    examtip:'Prefer a bastion/Load Balancer over assigning public IPs directly to instances.',
    mistake:'Assigning a public IP "just in case" during testing, then shipping it to production unchanged.'},
  {id:'openseclist', label:'Open Security Lists', risk:'A security list open to 0.0.0.0/0 on sensitive ports invites brute-force and scanning traffic.', severity:'Critical',
    example:'SSH (port 22) open to the internet led to thousands of automated login attempts within hours.',
    examtip:'Cloud Guard treats 0.0.0.0/0 ingress on management ports (22/3389) as a top-severity finding.',

  {id:'weakiam', label:'Weak IAM Policy', risk:'Overly broad policies (e.g. "manage all-resources in tenancy" for a normal user) violate least privilege.', severity:'Medium',

    examtip:'Detector checks for policies granting broad "manage" verbs at the tenancy level to non-admin groups.',

  {id:'dbexposure', label:'Database Exposure', risk:'A database accessible from the public internet bypasses your application\'s access controls entirely.', severity:'Critical',
    example:'An Autonomous Database left with a public endpoint was targeted by credential-stuffing bots.',
    examtip:'Databases should sit in private subnets, reached only via application tiers or a bastion.',
    mistake:'Enabling a public endpoint for "easy access during development" and never disabling it.'},
];
const SCAN_FINDINGS = [
  {label:'Public Bucket Found', sev:'high'},
  {label:'Security List Open to Internet', sev:'critical'},
  {label:'Unencrypted Volume', sev:'medium'},
  {label:'Unused IAM User', sev:'low'},
];

const RESPONDER_THREATS = [
  {id:'pubbucket', label:'Public Bucket', correctAction:'makeprivate'},
  {id:'openport', label:'Open Port', correctAction:'closeport'},
  {id:'unuseduser', label:'Unused User', correctAction:'disableuser'},
  {id:'unencrypted', label:'Unencrypted Volume', correctAction:'alert'},
];
const RESPONDER_ACTIONS = [
  {id:'makeprivate', label:'Automatically Make Private'},

function isUnlocked(id){
  const idx = MISSION_ORDER.indexOf(id);
  if(idx<=0) return true;
  return STATE.done.has(MISSION_ORDER[idx-1]);
}
function rankFor(xp){
  if(xp>=1300) return 'OCI Security & Governance Expert';
  if(xp>=850) return 'Senior Security Engineer';
  if(xp>=500) return 'Security Engineer';
  if(xp>=150) return 'Associate Security Engineer';
  return 'New Hire';
}
function computeSecurityScore(){
  let s = 20;
  if(STATE.m1.enabled) s += 20;
  if(STATE.m2.targetScope==='root') s += 15; else if(STATE.m2.targetScope) s += 5;
  s += Object.values(STATE.m3.detectors).filter(Boolean).length * 5;
  s += Object.keys(STATE.m4.mapped).length * 5;
  if(STATE.m5.zoneEnabled) s += 10;
  if(STATE.m6.created) s += 3;
  if(Object.keys(STATE.m7.deleted).length>=3) s += 2;
  return Math.min(100, s);
}
function threatLevelFor(score){
  if(score<40) return 'Critical';
  if(score<60) return 'High';
  if(score<80) return 'Medium';
  return 'Low';
}
function complianceScore(){
  if(STATE.m5.zoneEnabled) return 100;
  const base = Math.round(COMPLIANCE_AREAS.reduce((a,c)=>a+c.pct,0)/COMPLIANCE_AREAS.length);
  return base;
}
function monthlyCost(){
  const total = COST_SERVICES.reduce((a,c)=>a+c.amount,0);
  const saved = Object.keys(STATE.m7.deleted).reduce((a,id)=>a+(WASTED_RESOURCES.find(w=>w.id===id)?.savings||0),0);
  return total - saved;
}

function addXP(n, label){
  STATE.xp = Math.max(0, STATE.xp + n);
  document.getElementById('xpDisplay').textContent = STATE.xp;
  document.getElementById('rankChip').textContent = rankFor(STATE.xp);
  toast(n>=0?'xp':'err', (n>=0?'+':'')+n+' XP', label||'');
  checkAchievements();
}
function toast(type, title, msg){
  const wrap = document.getElementById('toast-wrap');
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  const ico = type==='xp' ? '⭐' : type==='ok' ? '✅' : type==='err' ? '⛔' : 'ℹ';
  el.innerHTML = `<div class="t-ico">${ico}</div><div><b>${title}</b><span>${msg||''}</span></div>`;
  wrap.appendChild(el);
  setTimeout(()=>{ el.style.transition='opacity .4s'; el.style.opacity='0'; setTimeout(()=>el.remove(),400); }, 3200);
}
function completeMission(id, xp){
  if(STATE.done.has(id)) return;
  STATE.done.add(id);
  addXP(xp, MISSIONS.find(m=>m.id===id).title + ' complete');
  toast('ok','Mission Complete', MISSIONS.find(m=>m.id===id).title);
  renderSidebar();
  const idx = MISSION_ORDER.indexOf(id);
  if(idx>=0 && idx<MISSION_ORDER.length-1){
    setTimeout(()=>toast('info','Next mission unlocked', MISSIONS[idx+1].title), 900);
  }
}
function checkAchievements(){
  ACHIEVEMENTS.forEach(a=>{
    if(!STATE.achUnlocked.has(a.id) && a.check(STATE)){
      STATE.achUnlocked.add(a.id);
      setTimeout(()=>toast('ok','Achievement Unlocked 🏆', a.name), 600);
    }
  });
}

function renderSidebar(){
  const groups = {main:'Overview', missions:'Mission Track', extra:'Beyond the Labs'};
  let html = '';

    html += `<h4>${groups[g]}</h4>`;
    NAV.filter(n=>n.group===g).forEach(n=>{
      let locked=false, done=false;
      if(MISSION_ORDER.includes(n.id)){ locked=!isUnlocked(n.id); done=STATE.done.has(n.id); }
      html += `<div class="nav-item ${STATE.view===n.id?'active':''} ${locked?'locked':''} ${done?'done':''}"

        <span class="n-ico">${done?'✓':n.ico}</span>${n.label}
        ${locked?'<span class="nav-badge">🔒</span>':''}
      </div>`;
    });
  });
  const pct = Math.round((STATE.done.size/MISSION_ORDER.length)*100);

}

    <p class="page-sub" style="margin-bottom:8px;"><b>Risk:</b> ${sel.risk}</p>

  <h4 style="margin-bottom:10px;">Live Security Scan</h4>
  ${!STATE.m3.scanDone ? `<button class="btn btn-ghost" ${enabledCount<3?'disabled':''} onclick="runScan()">🔍 Scan Entire Tenancy</button>${enabledCount<3?'<p class="page-sub" style="margin-top:6px;">Enable at least 3 detectors first.</p>':''}` :
    SCAN_FINDINGS.map(f=>`<div class="finding-row"><span class="sev-badge ${f.sev}">${f.sev}</span>${f.label}</div>`).join('')}
  ${enabledCount>=DETECTORS.length && STATE.m3.scanDone && !done ? `<div style="margin-top:16px;"><button class="btn btn-primary" onclick="completeMission('m3',110); renderMain();">✓ Complete Mission</button></div>` : ''}
  ${done ? renderQuizBlock('m3') : ''}`;
}
function toggleDetector(id){
  STATE.m3.detectors[id] = !STATE.m3.detectors[id];
  addXP(STATE.m3.detectors[id]?6:-2, id+' detector '+(STATE.m3.detectors[id]?'enabled':'disabled'));

}
function selectDetector(id){
  STATE.m3.selectedDetector = id;
  renderMain();
}
function runScan(){
  STATE.m3.scanDone = true;
  toast('info','Scan complete','4 findings across the tenancy');

}

/* ================= M4: RESPONDER RECIPES ================= */
function renderM4(){
  const done = STATE.done.has('m4');
  return `
  <div class="section-head"><div class="eyebrow">Mission 4 · 120 XP</div><h1 class="page-title">Configure Responder Recipes</h1>
  <p class="page-sub">Select an action, then click the threat it should remediate. Wrong pairings won't stick.</p></div>
  <div class="card" style="margin-bottom:14px;">
    <div class="arch-diagram" style="display:flex; align-items:center; justify-content:center; gap:14px; flex-wrap:wrap;">
      <span class="pill pill-red">Threat Detected</span><span>→</span><span class="pill pill-blue">Cloud Guard</span><span>→</span><span class="pill pill-orange">Responder Rule</span><span>→</span><span class="pill pill-green">Automatic Action</span>
    </div>
  </div>
  <div class="two-col">
    <div class="card">
      <h4 style="margin-bottom:10px;">Responder Actions</h4>
      <div class="chip-row">${RESPONDER_ACTIONS.map(a=>`<button class="chip ${STATE.m4.selectedAction===a.id?'active':''}" onclick="selectResponderAction('${a.id}')">${a.label}</button>`).join('')}</div>
    </div>
    <div class="card">
      <h4 style="margin-bottom:10px;">Threats</h4>
      ${RESPONDER_THREATS.map(t=>{
        const mapped = STATE.m4.mapped[t.id];
        return `<div class="finding-row" style="cursor:pointer;" onclick="mapResponder('${t.id}')">
          <span>${t.label}</span><span style="margin-left:auto;">${mapped ? '<span class="pill pill-green">'+RESPONDER_ACTIONS.find(a=>a.id===mapped).label+'</span>' : '<span class="pill pill-gray">unmapped</span>'}</span>
        </div>`;
      }).join('')}
    </div>
  </div>
  ${Object.keys(STATE.m4.mapped).length>=RESPONDER_THREATS.length && !done ? `<div style="margin-top:16px;"><button class="btn btn-primary" onclick="completeMission('m4',120); renderMain();">✓ Complete Mission</button></div>` : ''}
  ${done ? renderQuizBlock('m4') : ''}`;
}
function selectResponderAction(id){
  STATE.m4.selectedAction = id;
  renderMain();
}
function mapResponder(threatId){
  if(STATE.m4.mapped[threatId]) return;
  if(!STATE.m4.selectedAction){ toast('err','Select an action first',''); return; }
  const t = RESPONDER_THREATS.find(x=>x.id===threatId);
  if(t.correctAction===STATE.m4.selectedAction){
    STATE.m4.mapped[threatId] = STATE.m4.selectedAction;
    toast('ok','Correct mapping', t.label);
    addXP(12,'Responder configured: '+t.label);
    STATE.m4.selectedAction = null;
    renderMain();
  } else {
    toast('err','Wrong action','That won\'t fix '+t.label+'. Try again.');
  }
}

/* ================= M6: BUDGETS ================= */
function renderM6(){
  const done = STATE.done.has('m6');
  return `

  <div class="card">
    <div class="field"><label>Budget Name</label><input id="bgName" placeholder="Monthly-Tenancy-Budget"></div>

    <button class="btn btn-primary" onclick="createBudget()">Create Budget</button>
  </div>` : `
  <div class="card">
    <h4 style="margin-bottom:8px;">${STATE.m6.budget.name}</h4>

    <div class="slider-wrap">
      <label class="page-sub">Current Spend: ${STATE.m6.spend}% of budget</label>

    </div>
    <div class="tag-list">${BUDGET_THRESHOLDS.map(t=>`<span class="pill ${STATE.m6.alerted[t.pct]?'pill-red':'pill-gray'}">${STATE.m6.alerted[t.pct]?'🔔':'○'} ${t.pct}% — ${t.label}</span>`).join('')}</div>
    <div id="budgetNotif"></div>
  </div>`}
  <div class="info-box">💡 Layered thresholds (50/80/100%) give progressively urgent warnings before spend becomes critical.</div>
  ${STATE.m6.created && STATE.m6.alerted[100] && !done ? `<div style="margin-top:16px;"><button class="btn btn-primary" onclick="completeMission('m6',90); renderMain();">✓ Complete Mission</button></div>` : ''}
  ${done ? renderQuizBlock('m6') : ''}`;
}
function createBudget(){
  const name = document.getElementById('bgName').value.trim() || 'Monthly-Tenancy-Budget';
  const amount = document.getElementById('bgAmount').value.trim() || '50000';
  const compartment = document.getElementById('bgComp').value;
  const desc = document.getElementById('bgDesc').value.trim();
  STATE.m6.budget = {name, amount, compartment, desc};
  STATE.m6.created = true;
  toast('ok','Budget created', name);
  addXP(15,'Budget created');
  renderMain();
}
function updateSpend(val){
  STATE.m6.spend = parseInt(val,10);
  BUDGET_THRESHOLDS.forEach(t=>{
    if(STATE.m6.spend>=t.pct && !STATE.m6.alerted[t.pct]){
      STATE.m6.alerted[t.pct] = true;
      toast(t.pct>=100?'err':'info', t.label, `Spend crossed ${t.pct}%`);
      addXP(5, t.label+' triggered');
    }
  });
  renderMain();
}

/* ================= TROUBLESHOOTING ================= */
function renderTroubleshoot(){
  const solvedCount = Object.keys(STATE.tsSolved).length;
  return `<div class="section-head"><div class="eyebrow">Troubleshooting Missions</div><h1 class="page-title">Fix What's Broken</h1>
  <p class="page-sub">${solvedCount}/${TROUBLESHOOT.length} scenarios resolved.</p></div>
  ${TROUBLESHOOT.map(t=>`
    <div class="card" style="margin-bottom:12px;">
      <h5 style="margin-bottom:6px;">${t.title} ${STATE.tsSolved[t.id]?'<span class="pill pill-green">Solved</span>':''}</h5>
      <p class="page-sub" style="margin-bottom:10px;">${t.scenario}</p>
      <div id="tswrap-${t.id}">
        ${t.opts.map((o,i)=>`<div class="q-opt" onclick="answerTS('${t.id}',${i})">${o}</div>`).join('')}
        <div class="q-explain" id="tsex-${t.id}">${t.ex}</div>
      </div>
    </div>`).join('')}`;
}
function answerTS(id, idx){
  const t = TROUBLESHOOT.find(x=>x.id===id);
  const container = document.getElementById('tswrap-'+id);
  const opts = container.querySelectorAll('.q-opt');
  opts.forEach((o,i)=>{ o.onclick=null; if(i===t.a) o.classList.add('correct'); else if(i===idx) o.classList.add('incorrect'); });
  document.getElementById('tsex-'+id).classList.add('show');
  if(idx===t.a){ if(!STATE.tsSolved[id]){ STATE.tsSolved[id]=true; addXP(12, t.title+' resolved'); } }
  else toast('err','Not quite','Check the explanation below.');
  renderSidebar();
}

/* ================= CAPSTONE ================= */
function renderCapstone(){
  const allDone = MISSION_ORDER.every(m=>STATE.done.has(m));

    <h2 style="margin-bottom:8px;">Mission Complete — Enterprise Cloud Secured</h2>
    <div class="grid grid-4" style="margin:16px 0; text-align:left;">
      <div class="card" style="padding:12px;"><div class="pill pill-red">Security Score</div><h3 style="margin-top:6px;">${score}%</h3></div>

      <div class="card" style="padding:12px;"><div class="pill pill-orange">Cloud Guard</div><h3 style="margin-top:6px; font-size:14px;">Active</h3></div>

/* ================= QUIZ BLOCK (reused) ================= */
function renderQuizBlock(missionId){
  const qs = QUIZZES[missionId];
  if(!qs) return '';
  const answered = STATE.quizAnswered[missionId] || {};
  return `<div class="card" style="margin-top:20px;"><h4 style="margin-bottom:14px;">🎯 Knowledge Check</h4>
    ${qs.map((q,qi)=>`<div class="quiz-q"><div class="q-txt">${qi+1}. ${q.q}</div>
      ${q.opts.map((o,oi)=>`<div class="q-opt ${answered[qi]===oi?(oi===q.a?'correct':'incorrect'):''}" onclick="answerQuiz('${missionId}',${qi},${oi})">${o}</div>`).join('')}
      <div class="q-explain ${answered[qi]!==undefined?'show':''}">${q.ex}</div></div>`).join('')}
  </div>`;
}
function answerQuiz(missionId, qi, oi){
  if(!STATE.quizAnswered[missionId]) STATE.quizAnswered[missionId] = {};
  if(STATE.quizAnswered[missionId][qi] !== undefined) return;
  STATE.quizAnswered[missionId][qi] = oi;
  const q = QUIZZES[missionId][qi];
  if(oi===q.a){ STATE.quizScores[missionId] = (STATE.quizScores[missionId]||0)+1; addXP(10,'Correct answer'); }
  else toast('err','Not quite','Review the explanation.');
  renderMain();
}

  document.body.setAttribute('data-theme', theme);

</script>
