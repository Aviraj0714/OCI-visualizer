<style>
:root{
  --bg:#0d1117; --bg2:#11161d; --panel:#151b23; --panel2:#1a212b;
  --border:#232b36; --border-soft:#1d2530;
  --text:#e6ebf1; --text-dim:#9aa7b6; --text-faint:#5f6b7a;
  --red:#ff3b30; --red-dim:#c62b22; --red-glow:rgba(255,59,48,.25);
  --blue:#4da3ff; --blue-dim:#2f6fd1;
  --orange:#ffab40; --green:#3ddc84; --green-dim:#279a5c;
  --yellow:#ffd54a; --purple:#b48bff;
  --radius:14px; --radius-sm:9px;
  --shadow: 0 8px 30px rgba(0,0,0,.35);
  --mono: 'SFMono-Regular', Consolas, 'Courier New', monospace;
  --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif;
}
[data-theme="light"]{
  --bg:#f4f5f7; --bg2:#eceef1; --panel:#ffffff; --panel2:#f7f8fa;
  --border:#e1e4e9; --border-soft:#ebedf0;
  --text:#1b2129; --text-dim:#5b6572; --text-faint:#8b95a3;
  --red:#e0342a; --red-dim:#c62b22; --red-glow:rgba(224,52,42,.18);
  --shadow: 0 8px 30px rgba(20,20,30,.08);
}
*{box-sizing:border-box; margin:0; padding:0;}
html{scroll-behavior:smooth;}
body{background:var(--bg); color:var(--text); font-family:var(--sans); min-height:100vh; overflow-x:hidden; transition:background .3s,color .3s;}
body::before{content:''; position:fixed; inset:0; pointer-events:none; z-index:0;
  background: radial-gradient(circle at 15% 10%, var(--red-glow), transparent 40%), radial-gradient(circle at 85% 90%, rgba(77,163,255,.10), transparent 45%);}
::-webkit-scrollbar{width:10px; height:10px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border); border-radius:10px;}
a{color:inherit;} button{font-family:inherit; cursor:pointer;}

.topbar{position:sticky; top:0; z-index:100; display:flex; align-items:center; gap:14px; padding:10px 18px;
  background:color-mix(in srgb, var(--panel) 88%, transparent); backdrop-filter:blur(14px); border-bottom:1px solid var(--border-soft);}
.brand{display:flex; align-items:center; gap:10px; font-weight:700;}
.brand .logo{width:30px; height:30px; border-radius:8px; background:linear-gradient(135deg, var(--red), var(--red-dim));
  display:flex; align-items:center; justify-content:center; font-size:13px; color:#fff; font-weight:800; box-shadow:0 4px 14px var(--red-glow);}
.brand small{display:block; font-weight:500; color:var(--text-faint); font-size:10.5px; letter-spacing:.5px;}
.crumb{display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--text-dim); flex:1; min-width:0; overflow:hidden; white-space:nowrap;}
.crumb b{color:var(--text); font-weight:600;}
.topbar-right{display:flex; align-items:center; gap:10px;}
.xp-chip{display:flex; align-items:center; gap:7px; background:var(--panel2); border:1px solid var(--border); padding:6px 12px; border-radius:20px; font-size:12.5px; font-weight:600;}
.xp-chip .dot{width:7px; height:7px; border-radius:50%; background:var(--orange); box-shadow:0 0 8px var(--orange);}
.rank-chip{background:linear-gradient(135deg, var(--red), var(--red-dim)); color:#fff; font-size:11.5px; font-weight:700; padding:6px 11px; border-radius:20px;}
.icon-btn{width:34px; height:34px; border-radius:9px; border:1px solid var(--border); background:var(--panel2); color:var(--text-dim); display:flex; align-items:center; justify-content:center; font-size:15px; transition:.15s;}
.icon-btn:hover{color:var(--text); border-color:var(--text-faint);}

.app{display:flex; min-height:calc(100vh - 54px); position:relative; z-index:1;}
.sidebar{width:255px; flex-shrink:0; border-right:1px solid var(--border-soft); padding:16px 10px; position:sticky; top:54px; height:calc(100vh - 54px); overflow-y:auto; background:color-mix(in srgb, var(--bg2) 60%, transparent);}
.sidebar h4{font-size:10.5px; text-transform:uppercase; letter-spacing:1px; color:var(--text-faint); padding:14px 10px 6px;}
.nav-item{display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:9px; font-size:12.5px; color:var(--text-dim); cursor:pointer; transition:.15s; margin-bottom:2px; border:1px solid transparent;}
.nav-item .n-ico{width:22px; text-align:center; font-size:12.5px; flex-shrink:0;}
.nav-item:hover{background:var(--panel2); color:var(--text);}
.nav-item.active{background:var(--red-glow); color:var(--text); border-color:var(--red-dim); font-weight:600;}
.nav-item.locked{opacity:.4; cursor:not-allowed;}
.nav-item.done .n-ico{color:var(--green);}
.nav-badge{margin-left:auto; font-size:10px; background:var(--panel); border:1px solid var(--border); padding:1px 6px; border-radius:8px; color:var(--text-faint);}
.nav-item.done .nav-badge{color:var(--green); border-color:var(--green-dim);}
.progress-mini{margin:10px 8px 4px; padding:10px; background:var(--panel); border:1px solid var(--border); border-radius:10px;}
.progress-mini .lbl{display:flex; justify-content:space-between; font-size:11px; color:var(--text-dim); margin-bottom:6px;}
.bar-track{height:6px; border-radius:5px; background:var(--border-soft); overflow:hidden;}
.bar-fill{height:100%; background:linear-gradient(90deg, var(--red), var(--orange)); border-radius:5px; transition:width .5s ease;}

.main{flex:1; min-width:0; padding:26px 30px 80px;}
.view{display:none; animation:fadeIn .35s ease;}
.view.active{display:block;}
@keyframes fadeIn{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);}}
.section-head{margin-bottom:22px;}
.eyebrow{font-size:11px; text-transform:uppercase; letter-spacing:1.5px; color:var(--red); font-weight:700; margin-bottom:6px;}
h1.page-title{font-size:25px; font-weight:800; letter-spacing:-.3px;}
.page-sub{color:var(--text-dim); font-size:13.5px; margin-top:5px; max-width:700px;}
.card{background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); padding:20px; box-shadow:var(--shadow);}
.grid{display:grid; gap:16px;}
.grid-2{grid-template-columns:1fr 1fr;} .grid-3{grid-template-columns:repeat(3,1fr);} .grid-4{grid-template-columns:repeat(4,1fr);} .grid-6{grid-template-columns:repeat(6,1fr);}
@media(max-width:1000px){.grid-2,.grid-3,.grid-4,.grid-6{grid-template-columns:1fr 1fr;}}
@media(max-width:650px){.grid-2,.grid-3,.grid-4,.grid-6{grid-template-columns:1fr;}}
.btn{display:inline-flex; align-items:center; gap:8px; padding:11px 20px; border-radius:10px; border:none; font-weight:700; font-size:13.5px; transition:.15s;}
.btn-primary{background:linear-gradient(135deg,var(--red),var(--red-dim)); color:#fff; box-shadow:0 6px 20px var(--red-glow);}
.btn-primary:hover{transform:translateY(-1px); box-shadow:0 10px 26px var(--red-glow);}
.btn-ghost{background:var(--panel2); color:var(--text); border:1px solid var(--border);}
.btn-ghost:hover{border-color:var(--text-faint);}
.btn-sm{padding:7px 13px; font-size:12px; border-radius:8px;}
.btn:disabled{opacity:.4; cursor:not-allowed; transform:none !important;}
.pill{display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:700; padding:3px 9px; border-radius:20px;}
.pill-green{background:rgba(61,220,132,.14); color:var(--green);}
.pill-red{background:rgba(255,59,48,.14); color:var(--red);}
.pill-orange{background:rgba(255,171,64,.14); color:var(--orange);}
.pill-blue{background:rgba(77,163,255,.14); color:var(--blue);}
.pill-gray{background:var(--panel2); color:var(--text-faint); border:1px solid var(--border);}
#toast-wrap{position:fixed; bottom:22px; right:22px; z-index:9999; display:flex; flex-direction:column; gap:10px;}
.toast{background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:13px 16px; box-shadow:var(--shadow); display:flex; align-items:center; gap:10px; min-width:260px; animation:toastIn .3s ease; font-size:13px;}
@keyframes toastIn{from{opacity:0; transform:translateX(30px);} to{opacity:1; transform:translateX(0);}}
.toast .t-ico{font-size:18px;} .toast b{display:block; font-size:12.5px;} .toast span{color:var(--text-dim); font-size:11.5px;}
.toast.xp b{color:var(--orange);} .toast.ok .t-ico{color:var(--green);} .toast.err .t-ico{color:var(--red);}

.mission-map{position:relative; padding:20px 10px;}
.mission-track{display:flex; flex-wrap:wrap; gap:18px;}
.m-node{width:205px; background:var(--panel); border:1px solid var(--border); border-radius:16px; padding:16px; position:relative; transition:.2s; cursor:pointer;}
.m-node:hover{transform:translateY(-3px); border-color:var(--text-faint);}
.m-node.locked{opacity:.45; cursor:not-allowed; filter:grayscale(.6);}
.m-node.locked:hover{transform:none;}
.m-node.done{border-color:var(--green-dim); background:linear-gradient(180deg, rgba(61,220,132,.06), var(--panel));}
.m-node.current{border-color:var(--red-dim); box-shadow:0 0 0 3px var(--red-glow);}
.m-num{width:32px; height:32px; border-radius:10px; background:var(--panel2); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:12px; margin-bottom:8px;}
.m-node.done .m-num{background:var(--green); color:#052e17; border-color:var(--green);}
.m-node.current .m-num{background:var(--red); color:#fff; border-color:var(--red);}
.m-node h4{font-size:13.5px; margin-bottom:4px;}
.m-node p{font-size:11px; color:var(--text-dim); line-height:1.5; margin-bottom:8px;}
.m-node .m-xp{font-size:10.5px; color:var(--orange); font-weight:700;}

.terminal{background:#0a0d12; border-radius:12px; border:1px solid #232b36; font-family:var(--mono); font-size:12.5px; padding:16px; min-height:220px; color:#3ddc84; overflow-y:auto; max-height:420px;}
.terminal .line{margin-bottom:6px; line-height:1.6; white-space:pre-wrap;}
.terminal .prompt{color:#4da3ff;} .terminal .out{color:#c9d2dc;} .terminal .comment{color:#5f6b7a;} .terminal .errline{color:#ff6b60;}

.field{margin-bottom:14px;}
.field label{display:block; font-size:12px; color:var(--text-dim); margin-bottom:6px; font-weight:600;}
.field input, .field select{width:100%; padding:10px 12px; border-radius:9px; border:1px solid var(--border); background:var(--panel2); color:var(--text); font-size:13px; font-family:inherit;}
.field input:focus, .field select:focus{outline:none; border-color:var(--red-dim);}

.health-meter{margin-bottom:12px;}
.health-meter .hm-lbl{display:flex; justify-content:space-between; font-size:11.5px; color:var(--text-dim); margin-bottom:5px;}
.hm-track{height:8px; border-radius:6px; background:var(--border-soft); overflow:hidden;}
.hm-fill{height:100%; border-radius:6px; transition:width .5s ease;}

.service-row{display:flex; align-items:center; gap:12px; padding:12px 14px; border:1px solid var(--border); border-radius:10px; margin-bottom:8px; background:var(--panel2);}
.service-row .svc-name{font-weight:700; width:100px; font-size:13px;}
.service-row .svc-actions{margin-left:auto; display:flex; gap:6px;}

.perm-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin:14px 0;}
.perm-col{text-align:center; padding:12px; border:1px solid var(--border); border-radius:10px; background:var(--panel2);}
.perm-col h5{font-size:12px; margin-bottom:8px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.5px;}
.perm-check{display:flex; align-items:center; gap:6px; justify-content:center; padding:4px 0; font-size:12.5px;}

.log-line{padding:6px 10px; font-family:var(--mono); font-size:11.5px; border-radius:6px; cursor:pointer; margin-bottom:3px; color:var(--text-dim);}
.log-line:hover{background:var(--panel2);}
.log-line.flagged{background:rgba(255,59,48,.12); color:var(--red); font-weight:600;}
.log-line.correct-flag{background:rgba(61,220,132,.12); color:var(--green); font-weight:600;}

.incident-card{border:1px solid var(--border); border-radius:12px; padding:16px; background:var(--panel2); margin-bottom:12px;}
.incident-card.resolved{border-color:var(--green-dim); opacity:.6;}
.incident-timer{height:5px; border-radius:4px; background:var(--border-soft); overflow:hidden; margin:8px 0;}
.incident-timer .fill{height:100%; background:linear-gradient(90deg,var(--red),var(--orange)); transition:width 1s linear;}

.quiz-q{margin-bottom:20px; padding-bottom:16px; border-bottom:1px solid var(--border-soft);}
.quiz-q:last-child{border:none;}
.quiz-q .q-txt{font-weight:700; font-size:14px; margin-bottom:12px;}
.q-opt{display:flex; align-items:center; gap:10px; padding:11px 14px; border:1px solid var(--border); border-radius:10px; margin-bottom:8px; cursor:pointer; transition:.15s; font-size:13px;}
.q-opt:hover{border-color:var(--text-faint);}
.q-opt.correct{border-color:var(--green-dim); background:rgba(61,220,132,.1);}
.q-opt.incorrect{border-color:var(--red-dim); background:rgba(255,59,48,.1);}
.q-explain{margin-top:8px; padding:10px 12px; background:var(--panel2); border-radius:9px; font-size:12px; color:var(--text-dim); display:none; border-left:3px solid var(--blue-dim);}
.q-explain.show{display:block;}

.ach-card{text-align:center; padding:20px 12px; border-radius:14px; border:1px solid var(--border); background:var(--panel); transition:.2s;}
.ach-card.locked{opacity:.35; filter:grayscale(1);}
.ach-card .ico{font-size:32px; margin-bottom:8px;}
.ach-card h5{font-size:12.5px; margin-bottom:4px;}
.ach-card p{font-size:10.5px; color:var(--text-dim);}

.hr{height:1px; background:var(--border-soft); margin:20px 0;}
.two-col{display:grid; grid-template-columns:1fr 1fr; gap:18px;}

.tag-list{display:flex; flex-wrap:wrap; gap:8px;}
.info-box{padding:12px 14px; border-radius:10px; border-left:3px solid var(--blue-dim); background:rgba(77,163,255,.06); font-size:12.5px; margin:12px 0;}
.tip-box{padding:12px 14px; border-radius:10px; border-left:3px solid var(--orange); background:rgba(255,171,64,.07); font-size:12.5px; margin:12px 0;}
.mistake-box{padding:12px 14px; border-radius:10px; border-left:3px solid var(--red); background:rgba(255,59,48,.06); font-size:12.5px; margin:12px 0;}
.hidden{display:none !important;}
.chip-row{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px;}
.chip{padding:8px 13px; background:var(--panel2); border:1px solid var(--border); border-radius:8px; font-size:12px; font-weight:600; cursor:pointer; transition:.15s;}

.code-block{background:#0a0d12; border:1px solid #232b36; border-radius:10px; padding:14px; font-family:var(--mono); font-size:12px; color:#c9d2dc; overflow-x:auto; white-space:pre;}
</style>

function isUnlocked(id){
  const idx = MISSION_ORDER.indexOf(id);
  if(idx<=0) return true;
  return STATE.done.has(MISSION_ORDER[idx-1]);
}
function rankFor(xp){
  if(xp>=1400) return 'Cloud Operations Engineer';
  if(xp>=900) return 'Senior Ops Engineer';
  if(xp>=500) return 'Ops Engineer';
  if(xp>=150) return 'Associate Engineer';
  return 'Junior Engineer';
}
function addXP(n, label){
  STATE.xp = Math.max(0, STATE.xp + n);
  document.getElementById('xpDisplay').textContent = STATE.xp;
  document.getElementById('rankChip').textContent = rankFor(STATE.xp);
  toast(n>=0?'xp':'err', (n>=0?'+':'')+n+' XP', label||'');
  checkAchievements();
}
function toast(type, title, msg){
  const wrap = document.getElementById('toast-wrap');
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  const ico = type==='xp' ? '⭐' : type==='ok' ? '✅' : type==='err' ? '⛔' : 'ℹ';
  el.innerHTML = `<div class="t-ico">${ico}</div><div><b>${title}</b><span>${msg||''}</span></div>`;
  wrap.appendChild(el);
  setTimeout(()=>{ el.style.transition='opacity .4s'; el.style.opacity='0'; setTimeout(()=>el.remove(),400); }, 3200);
}
function completeMission(id, xp){
  if(STATE.done.has(id)) return;
  STATE.done.add(id);
  STATE.opsScore += 10;
  STATE.reliability = Math.min(100, STATE.reliability+3);
  addXP(xp, MISSIONS.find(m=>m.id===id).title + ' complete');
  toast('ok','Mission Complete', MISSIONS.find(m=>m.id===id).title);
  renderSidebar();
  const idx = MISSION_ORDER.indexOf(id);
  if(idx>=0 && idx<MISSION_ORDER.length-1){
    setTimeout(()=>toast('info','Next mission unlocked', MISSIONS[idx+1].title), 900);
  }
}
function checkAchievements(){
  ACHIEVEMENTS.forEach(a=>{
    if(!STATE.achUnlocked.has(a.id) && a.check(STATE)){
      STATE.achUnlocked.add(a.id);
      setTimeout(()=>toast('ok','Achievement Unlocked 🏆', a.name), 600);
    }
  });
}

/* ================= NAV ================= */
function renderSidebar(){
  const groups = {main:'Overview', missions:'Mission Track', extra:'Beyond the Labs'};
  let html = '';
  Object.keys(groups).forEach(g=>{
    html += `<h4>${groups[g]}</h4>`;
    NAV.filter(n=>n.group===g).forEach(n=>{
      let locked=false, done=false;
      if(MISSION_ORDER.includes(n.id)){ locked=!isUnlocked(n.id); done=STATE.done.has(n.id); }
      html += `<div class="nav-item ${STATE.view===n.id?'active':''} ${locked?'locked':''} ${done?'done':''}"
        onclick="${locked?'':`setView('${n.id}')`}">
        <span class="n-ico">${done?'✓':n.ico}</span>${n.label}
        ${locked?'<span class="nav-badge">🔒</span>':''}
      </div>`;
    });
  });
  const pct = Math.round((STATE.done.size/MISSION_ORDER.length)*100);
  html += `<div class="progress-mini"><div class="lbl"><span>Mission Progress</span><span>${pct}%</span></div>
    <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div></div>`;
  document.getElementById('sidebar').innerHTML = html;
}
function setView(id){
  STATE.view = id;
  const nav = NAV.find(n=>n.id===id);
  document.getElementById('crumbCurrent').textContent = nav ? nav.label : id;
  renderSidebar();
  renderMain();
  const mainEl = document.getElementById('main');
  if(mainEl.scrollIntoView) mainEl.scrollIntoView({behavior:'smooth', block:'start'});
}
function renderMain(){
  const map = {
    home:renderHome, missionmap:renderMissionMap,
    m1:renderM1, m2:renderM2, m3:renderM3, m4:renderM4, m5:renderM5, m6:renderM6,
    m7:renderM7, m8:renderM8, m9:renderM9, m10:renderM10, m11:renderM11, m12:renderM12,
    achievements:renderAchievements, capstone:renderCapstone,
  };
  const fn = map[STATE.view] || renderHome;
  document.getElementById('main').innerHTML = `<div class="view active">${fn()}</div>`;
  afterRenderHooks[STATE.view] && afterRenderHooks[STATE.view]();
}

function runM3Cmd(c){
  const term = document.getElementById('m3term');

  if(c==='id') out = users.length ? `uid=${users[0].uid}(${users[0].u}) gid=${users[0].gid}(${users[0].u}) groups=${users[0].gid}(${users[0].u})` : 'id: no users created yet';

function permString(p){
  return (p.r?'r':'-')+(p.w?'w':'-')+(p.x?'x':'-');
}
function chmodNumber(){
  const m = STATE.m4.owner, g = STATE.m4.group, o = STATE.m4.others;

  return ''+num(m)+num(g)+num(o);
}

    STATE.m4.group.r===t.gr && STATE.m4.group.w===t.gw && STATE.m4.group.x===t.gx &&
    STATE.m4.others.r===t.or && STATE.m4.others.w===t.ow && STATE.m4.others.x===t.ox;
  if(matches && !STATE.m4.fixed){ STATE.m4.fixed = true; }
  return `
  <div class="section-head"><div class="eyebrow">Mission 4 · 110 XP</div><h1 class="page-title">Groups &amp; Permissions</h1>

        </div>`).join('')}

  <div class="info-box">💡 chmod uses octal digits: read=4, write=2, execute=1, summed per owner/group/others (e.g. 754 = rwxr-xr--).</div>

  ${done ? renderQuizBlock('m8') : ''}`;

function selectLogFile(f){
  document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
  const chip = document.getElementById('logchip-'+f); if(chip) chip.classList.add('active');
  const lines = LOG_FILES[f];
  document.getElementById('logView').innerHTML = `<h4 style="margin-bottom:10px;">/var/log/${f}</h4>` + lines.map((l,i)=>{
    const isObj = typeof l === 'object';
    const text = isObj ? l.text : l;
    const key = f+'-'+i;
    const flaggedState = STATE.m8.investigated[key];
    const cls = flaggedState==='correct' ? 'correct-flag' : flaggedState==='wrong' ? 'flagged' : '';
    return `<div class="log-line ${cls}" onclick="flagLog('${f}',${i})">${text}</div>`;
  }).join('');
}
function flagLog(f, i){
  const l = LOG_FILES[f][i];
  const key = f+'-'+i;
  if(STATE.m8.investigated[key]) return;
  if(typeof l === 'object' && l.bad){
    STATE.m8.investigated[key] = 'correct';
    STATE.m8.flaggedTotal++;
    toast('ok','Anomaly found', l.cause);
    addXP(10, 'Flagged: '+l.cause);
  } else {
    STATE.m8.investigated[key] = 'wrong';
    toast('err','Not suspicious','That line looks routine — keep investigating.');
  }
  selectLogFile(f);
  renderSidebar();
}

/* ================= M9: NETWORKING ================= */
function renderM9(){
  const done = STATE.done.has('m9');
  const ranCount = Object.keys(STATE.m9.ran).length;
  afterRenderHooks.m9 = ()=>{ const t=document.getElementById('m9term'); if(t) t.scrollTop = t.scrollHeight; };
  return `
  <div class="section-head"><div class="eyebrow">Mission 9 · 110 XP</div><h1 class="page-title">Networking Lab</h1>
  <p class="page-sub">Run each diagnostic command, then use them to resolve an injected failure.</p></div>
  <div class="chip-row">${NET_COMMANDS.map((c,i)=>`<button class="chip" onclick="runNetCmd(${i})">${c.cmd.split(' ')[0]}</button>`).join('')}</div>
  <div class="terminal" id="m9term"><div class="line comment"># Commands run: ${ranCount}/${NET_COMMANDS.length}</div></div>
  <div class="hr"></div>
  <h4 style="margin-bottom:10px;">Network Troubleshooting Game</h4>
  <p class="page-sub" style="margin-bottom:10px;">Scenario: the website is unavailable. Inject a failure, then run the matching command to diagnose it.</p>
  <div class="chip-row">${NET_FAILURES.map(f=>`<button class="chip ${STATE.m9.failureActive===f.id?'active':''}" onclick="injectFailure('${f.id}')">${f.label}</button>`).join('')}</div>
  <div id="failureBox"></div>
  ${ranCount>=NET_COMMANDS.length && Object.keys(STATE.m9.fixed).length>=1 && !done ? `<div style="margin-top:16px;"><button class="btn btn-primary" onclick="completeMission('m9',110); renderMain();">✓ Complete Mission</button></div>` : ''}
  ${done ? renderQuizBlock('m9') : ''}`;
}
function runNetCmd(i){
  const c = NET_COMMANDS[i];
  const term = document.getElementById('m9term');
  term.innerHTML += `<div class="line"><span class="prompt">$</span> ${c.cmd}</div><div class="line out">${c.out.replace(/\n/g,'<br>')}</div><div class="line comment"># ${c.note}</div>`;
  term.scrollTop = term.scrollHeight;
  STATE.m9.ran[c.cmd] = true;
  if(STATE.m9.failureActive){
    const f = NET_FAILURES.find(x=>x.id===STATE.m9.failureActive);
    if(f && c.cmd.startsWith(f.fixCmd.split(' ')[0])){
      STATE.m9.diagnosed[f.id] = true;
      document.getElementById('failureBox').innerHTML = `<div class="info-box">✓ Correct diagnostic tool for ${f.label}: ${f.explain}</div>
        <button class="btn btn-primary btn-sm" onclick="fixFailure('${f.id}')">Apply Fix</button>`;
    }
  }
  addXP(5, c.cmd.split(' ')[0]+' explained');
  renderSidebar();
}
function injectFailure(id){
  STATE.m9.failureActive = id;
  const f = NET_FAILURES.find(x=>x.id===id);
  document.getElementById('failureBox').innerHTML = `<div class="mistake-box">⚠ ${f.label} injected — the site is now unreachable. Run the right diagnostic command above to find out why.</div>`;
  renderMain();
}
function fixFailure(id){
  STATE.m9.fixed[id] = true;
  STATE.m9.failureActive = null;
  toast('ok','Issue resolved', NET_FAILURES.find(x=>x.id===id).label+' fixed');
  addXP(15,'Network issue resolved');
  renderMain();
}

/* ================= M10: OCI CLI ================= */
function renderM10(){
  const done = STATE.done.has('m10');
  const step = STATE.m10.step;
  afterRenderHooks.m10 = ()=>{ const t=document.getElementById('m10term'); if(t) t.scrollTop = t.scrollHeight; };
  const ctAnswered = Object.keys(STATE.m10ct).length;
  return `
  <div class="section-head"><div class="eyebrow">Mission 10 · 120 XP</div><h1 class="page-title">OCI CLI</h1>
  <p class="page-sub">Configure and run real OCI CLI commands from this Cloud Shell.</p></div>
  <div class="terminal" id="m10term">
    ${STATE.m10.history.map(h=>`<div class="line"><span class="prompt">$</span> ${h.cmd}</div><div class="line out">${h.out.replace(/\n/g,'<br>')}</div><div class="line comment"># ${h.note}</div>`).join('')}
    ${step<CLI_STEPS_M10.length ? `<div class="line"><span class="prompt">$</span> <span style="color:var(--text-faint);">${CLI_STEPS_M10[step].cmd}</span></div>` : ''}
  </div>
  <div style="margin-top:14px;">${step<CLI_STEPS_M10.length ? `<button class="btn btn-primary" onclick="runM10Step()">▶ Run: ${CLI_STEPS_M10[step].cmd.split(' ').slice(0,3).join(' ')}...</button>` : `<span class="pill pill-green">All commands executed</span>`}</div>
  <div class="hr"></div>
  <h4 style="margin-bottom:10px;">CLI Troubleshooting (${ctAnswered}/${CLI_TROUBLESHOOT.length})</h4>
  ${CLI_TROUBLESHOOT.map(c=>`
    <div class="card" style="margin-bottom:12px;">
      <h5 style="margin-bottom:6px;">${c.title} ${STATE.m10ct[c.id]?'<span class="pill pill-green">Solved</span>':''}</h5>
      <p class="page-sub" style="margin-bottom:10px;">${c.scenario}</p>
      <div id="ctwrap-${c.id}">
        ${c.opts.map((o,i)=>`<div class="q-opt" onclick="answerCT('${c.id}',${i})">${o}</div>`).join('')}
        <div class="q-explain" id="ctex-${c.id}">${c.ex}</div>
      </div>
    </div>`).join('')}
  ${step>=CLI_STEPS_M10.length && ctAnswered>=CLI_TROUBLESHOOT.length && !done ? `<div style="margin-top:16px;"><button class="btn btn-primary" onclick="completeMission('m10',120); renderMain();">✓ Complete Mission</button></div>` : ''}
  ${done ? renderQuizBlock('m10') : ''}`;
}
function runM10Step(){
  const s = CLI_STEPS_M10[STATE.m10.step];
  STATE.m10.history.push(s);
  STATE.m10.step++;
  STATE.cliCount++;
  addXP(8, s.cmd.split(' ').slice(0,2).join(' '));
  renderMain();
}
function answerCT(id, idx){
  const c = CLI_TROUBLESHOOT.find(x=>x.id===id);
  const container = document.getElementById('ctwrap-'+id);
  const opts = container.querySelectorAll('.q-opt');
  opts.forEach((o,i)=>{ o.onclick=null; if(i===c.a) o.classList.add('correct'); else if(i===idx) o.classList.add('incorrect'); });
  document.getElementById('ctex-'+id).classList.add('show');
  if(idx===c.a){ if(!STATE.m10ct[id]){ STATE.m10ct[id]=true; addXP(12, c.title+' resolved'); } }
  else toast('err','Not quite','Check the explanation below.');
  renderSidebar();
}

/* ================= M11: OCI SDK ================= */
function renderM11(){
  const done = STATE.done.has('m11');
  const execCount = Object.keys(STATE.m11.executed).length;
  return `
  <div class="section-head"><div class="eyebrow">Mission 11 · 120 XP</div><h1 class="page-title">OCI SDK — API Explorer</h1>
  <p class="page-sub">Choose a language, generate sample code, and execute API calls.</p></div>
  <div class="chip-row">${Object.keys(SDK_LANGS).map(l=>`<button class="chip ${STATE.m11.lang===l?'active':''}" onclick="setSdkLang('${l}')">${l}</button>`).join('')}</div>
  <div class="code-block">${SDK_LANGS[STATE.m11.lang]}</div>
  <div class="chip-row" style="margin-top:14px;">${Object.keys(SDK_RESPONSES).map(a=>`<button class="btn btn-ghost btn-sm" onclick="execSdk('${a}')">Execute: ${a}</button>`).join('')}</div>
  <div id="sdkResult"></div>
  <div class="hr"></div>
  <h4 style="margin-bottom:10px;">API Debugging Game</h4>
  ${API_DEBUG_GAME.map((q,qi)=>`
    <div class="quiz-q">
      <div class="q-txt">${q.q}</div>
      ${q.opts.map((o,oi)=>`<div class="q-opt" onclick="answerApiDebug(${qi},${oi})">${o}</div>`).join('')}
      <div class="q-explain" id="apidebug-ex-${qi}">${q.ex}</div>
    </div>`).join('')}
  ${execCount>=3 && !done ? `<div style="margin-top:16px;"><button class="btn btn-primary" onclick="completeMission('m11',120); renderMain();">✓ Complete Mission</button></div>` : ''}
  ${done ? renderQuizBlock('m11') : ''}`;
}
function setSdkLang(l){ STATE.m11.lang = l; renderMain(); }
function execSdk(action){
  STATE.m11.executed[action] = true;
  document.getElementById('sdkResult').innerHTML = `<div class="code-block" style="margin-top:10px;">${SDK_RESPONSES[action]}</div>`;
  addXP(10, action);
  renderSidebar();
}
function answerApiDebug(qi, oi){
  const q = API_DEBUG_GAME[qi];
  document.getElementById('apidebug-ex-'+qi).classList.add('show');
  if(oi===q.a) addXP(10,'API debugging solved');
  else toast('err','Not quite','Review the explanation.');
}

/* ================= M12: INCIDENT RESPONSE ================= */
function renderM12(){
  const done = STATE.done.has('m12');
  return `
  <div class="section-head"><div class="eyebrow">Mission 12 · 150 XP</div><h1 class="page-title">Incident Response Challenge</h1>
  <p class="page-sub">Live Operations Center — resolve incidents to raise your Ops Score. Resolved: ${STATE.m12.resolved.size}/${INCIDENTS.length}.</p></div>
  ${INCIDENTS.map(inc=>{
    const resolved = STATE.m12.resolved.has(inc.id);
    return `<div class="incident-card ${resolved?'resolved':''}">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <h4>🚨 ${inc.title}</h4>${resolved?'<span class="pill pill-green">Resolved</span>':'<span class="pill pill-red">Active</span>'}
      </div>
      <p class="page-sub" style="margin:8px 0 4px;">Logs: <code>${inc.logs}</code></p>
      <p class="page-sub" style="margin-bottom:10px;">Metrics: ${inc.metrics}</p>
      ${!resolved ? `<div id="inc-${inc.id}">${inc.opts.map((o,i)=>`<div class="q-opt" onclick="answerIncident('${inc.id}',${i})">${o}</div>`).join('')}</div>` : ''}
    </div>`;
  }).join('')}
  ${STATE.m12.resolved.size>=10 && !done ? `<div style="margin-top:16px;"><button class="btn btn-primary" onclick="completeMission('m12',150); renderMain();">✓ Complete Mission</button></div>` : ''}
  ${done ? renderQuizBlock('m12') : ''}`;
}
function answerIncident(id, idx){
  const inc = INCIDENTS.find(x=>x.id===id);
  const container = document.getElementById('inc-'+id);
  const opts = container.querySelectorAll('.q-opt');
  opts.forEach((o,i)=>{ o.onclick=null; if(i===inc.a) o.classList.add('correct'); else if(i===idx) o.classList.add('incorrect'); });
  if(idx===inc.a){
    STATE.m12.resolved.add(id);
    STATE.opsScore += 15;
    addXP(15, inc.title+' resolved');
    toast('ok','Incident resolved', inc.title);
  } else {
    addXP(-5, 'Incorrect response to '+inc.title);
  }
  renderSidebar();
  setTimeout(renderMain, 500);
}

/* ================= ACHIEVEMENTS ================= */
function renderAchievements(){
  return `
  <div class="section-head"><div class="eyebrow">Achievements</div><h1 class="page-title">Trophy Case</h1>
  <p class="page-sub">${STATE.achUnlocked.size}/${ACHIEVEMENTS.length} unlocked</p></div>
  <div class="grid grid-4">
    ${ACHIEVEMENTS.map(a=>{ const u = STATE.achUnlocked.has(a.id);
      return `<div class="ach-card ${u?'':'locked'}"><div class="ico">${a.ico}</div><h5>${a.name}</h5><p>${u?'Unlocked':a.cond}</p></div>`;
    }).join('')}
  </div>`;
}

/* ================= CAPSTONE ================= */
function renderCapstone(){
  const allDone = MISSION_ORDER.every(m=>STATE.done.has(m));
  const checklist = [
    {label:'SSH access secured', ok:STATE.done.has('m2')},
    {label:'Users &amp; permissions correct', ok:STATE.done.has('m3') && STATE.done.has('m4')},
    {label:'Required packages &amp; services running', ok:STATE.done.has('m5') && STATE.done.has('m6')},
    {label:'Cron automation scheduled', ok:STATE.done.has('m7')},
    {label:'Logs reviewed, no unresolved anomalies', ok:STATE.done.has('m8')},
    {label:'Networking &amp; DNS verified', ok:STATE.done.has('m9')},
    {label:'OCI CLI configured &amp; working', ok:STATE.done.has('m10')},
    {label:'OCI SDK authenticating successfully', ok:STATE.done.has('m11')},
    {label:'All incidents resolved', ok:STATE.done.has('m12')},
  ];
  return `
  <div class="section-head"><div class="eyebrow">Final Capstone</div><h1 class="page-title">Enterprise Server Restoration</h1>
  <p class="page-sub">A broken production Oracle Linux server needs full recovery across Linux, networking, services, CLI, and SDK.</p></div>
  <div class="card">${checklist.map(c=>`<div style="display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border-soft);">
    <span class="pill ${c.ok?'pill-green':'pill-gray'}">${c.ok?'✓':'○'}</span><span>${c.label}</span></div>`).join('')}</div>
  ${allDone ? `
  <div class="card" style="text-align:center; margin-top:18px; padding:44px; background:linear-gradient(180deg, rgba(61,220,132,.12), var(--panel));">
    <div style="font-size:44px;margin-bottom:10px;">🎓</div>
    <h2 style="margin-bottom:8px;">Mission Complete — Enterprise Server Restored</h2>
    <p class="page-sub" style="margin-bottom:14px;">Linux Expert · OCI CLI Expert · Cloud Operations Engineer · XP ${STATE.xp}</p>
    <div class="pill pill-green" style="font-size:13px; padding:8px 16px;">Certification Ready</div>
  </div>` : `<div class="tip-box" style="margin-top:16px;">Complete all 12 missions to restore the server and unlock your capstone certificate.</div>`}`;
}

/* ================= QUIZ BLOCK (reused) ================= */
function renderQuizBlock(missionId){
  const qs = QUIZZES[missionId];
  if(!qs) return '';
  const answered = STATE.quizAnswered[missionId] || {};
  return `<div class="card" style="margin-top:20px;"><h4 style="margin-bottom:14px;">🎯 Knowledge Check</h4>
    ${qs.map((q,qi)=>`<div class="quiz-q"><div class="q-txt">${qi+1}. ${q.q}</div>
      ${q.opts.map((o,oi)=>`<div class="q-opt ${answered[qi]===oi?(oi===q.a?'correct':'incorrect'):''}" onclick="answerQuiz('${missionId}',${qi},${oi})">${o}</div>`).join('')}
      <div class="q-explain ${answered[qi]!==undefined?'show':''}">${q.ex}</div></div>`).join('')}
  </div>`;
}
function answerQuiz(missionId, qi, oi){
  if(!STATE.quizAnswered[missionId]) STATE.quizAnswered[missionId] = {};
  if(STATE.quizAnswered[missionId][qi] !== undefined) return;
  STATE.quizAnswered[missionId][qi] = oi;
  const q = QUIZZES[missionId][qi];
  if(oi===q.a){ STATE.quizScores[missionId] = (STATE.quizScores[missionId]||0)+1; addXP(10,'Correct answer'); }
  else toast('err','Not quite','Review the explanation.');
  renderMain();
}

/* ================= INIT ================= */
function toggleTheme(){
  const theme = document.body.getAttribute('data-theme')==='dark' ? 'light' : 'dark';
  document.body.setAttribute('data-theme', theme);
}
document.getElementById('themeToggle').addEventListener('click', toggleTheme);
renderSidebar();
renderMain();
window.STATE = STATE; // debug/introspection hook
Object.assign(window, {QUIZZES, MISSIONS, MISSION_ORDER, NET_COMMANDS, LOG_FILES, CLI_STEPS_M10,
  CLI_TROUBLESHOOT, INCIDENTS, CRON_JOBS, PACKAGES, SDK_RESPONSES, SDK_LANGS, M3_TARGETS, ACHIEVEMENTS});

</script>
</body>
